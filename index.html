<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استمارة إضافة الطالب — الإيمس</title>
<!-- استدعاء خط القاهرة العصري ومكتبة الأيقونات -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root {
  --bg-deep: #060b14;
  --glass-bg: rgba(18, 28, 46, 0.72);
  --glass-card: rgba(15, 23, 42, 0.65);
  --glass-border: rgba(56, 189, 248, 0.18);
  --neon-emerald: #10b981;
  --neon-cyan: #06b6d4;
  --neon-blue: #3b82f6;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --rd: #f43f5e;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background-color: var(--bg-deep);
  background-image: 
    radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.20) 0%, transparent 45%),
    radial-gradient(circle at 10% 50%, rgba(6, 182, 212, 0.12) 0%, transparent 40%),
    radial-gradient(circle at 90% 90%, rgba(59, 130, 246, 0.14) 0%, transparent 45%);
  background-attachment: fixed;
  font-family: 'Cairo', Tahoma, sans-serif;
  color: var(--text-main);
  line-height: 1.6;
  min-height: 100vh;
}

.wrap {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 20px 16px 50px;
}

/* الهيدر والشعار المتوهج */
header {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 12px;
  margin: 15px 0 30px;
  padding: 24px 18px;
  background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.85) 100%);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.5), 0 0 25px rgba(16, 185, 129, 0.1);
}

.hero-icon {
  width: 78px;
  height: 78px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 22px;
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.18), rgba(6, 182, 212, 0.18));
  border: 1px solid rgba(16, 185, 129, 0.45);
  box-shadow: 0 0 25px rgba(16, 185, 129, 0.35), inset 0 0 15px rgba(6, 182, 212, 0.25);
  color: var(--neon-emerald);
  font-size: 36px;
}

header h1 {
  font-size: 22px;
  font-weight: 800;
  margin: 0;
  background: linear-gradient(90deg, #ffffff, #a7f3d0, #67e8f9);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 25px rgba(16, 185, 129, 0.3);
}

header small {
  display: block;
  color: var(--text-muted);
  font-size: 14px;
  margin-top: 4px;
}

/* عناوين الأقسام */
h2 {
  margin: 28px 0 12px;
  padding: 12px 18px;
  background: linear-gradient(90deg, rgba(16, 185, 129, 0.18) 0%, rgba(15, 23, 42, 0.6) 100%);
  border: 1px solid rgba(16, 185, 129, 0.35);
  border-right: 4px solid var(--neon-emerald);
  border-radius: 16px;
  font-size: 17px;
  font-weight: 700;
  color: #ecfdf5;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
}

h2 i {
  color: var(--neon-emerald);
  font-size: 19px;
  filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.6));
}

/* شبكة الحقول الزجاجية */
.grid {
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 22px;
  padding: 16px;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 14px;
  box-shadow: 0 12px 32px -5px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.08);
}

.f {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px 14px;
  background: var(--glass-card);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 16px;
  transition: all 0.25s ease;
}

.f:focus-within {
  border-color: rgba(16, 185, 129, 0.5);
  box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
  transform: translateY(-2px);
}

.f span {
  font-size: 14px;
  font-weight: 700;
  color: #e2e8f0;
  display: flex;
  align-items: center;
  gap: 4px;
}

.f b {
  color: var(--rd);
  margin-inline-start: 4px;
  font-size: 16px;
  text-shadow: 0 0 8px rgba(244, 63, 94, 0.5);
}

/* حقول الإدخال والقوائم */
input, select {
  font: inherit;
  font-size: 15px;
  padding: 10px 14px;
  border: 1.5px solid rgba(56, 189, 248, 0.2);
  border-radius: 12px;
  background: rgba(9, 14, 23, 0.85);
  color: #ffffff;
  width: 100%;
  transition: all 0.25s ease;
}

select option {
  background: #0f172a;
  color: #fff;
}

input:focus, select:focus {
  outline: none;
  border-color: var(--neon-emerald);
  box-shadow: 0 0 12px rgba(16, 185, 129, 0.35);
  background: rgba(9, 14, 23, 1);
}

/* تنسيق خاص لحقول رفع الصور */
input[type=file] {
  padding: 8px;
  background: rgba(16, 185, 129, 0.06);
  border: 1.5px dashed rgba(16, 185, 129, 0.4);
  cursor: pointer;
  color: var(--text-muted);
}

input[type=file]::file-selector-button {
  font-family: 'Cairo', sans-serif;
  font-weight: 700;
  background: linear-gradient(135deg, var(--neon-emerald), var(--neon-cyan));
  color: #fff;
  border: 0;
  padding: 6px 14px;
  border-radius: 8px;
  margin-left: 12px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
  transition: 0.2s;
}

input[type=file]::file-selector-button:hover {
  filter: brightness(1.1);
}

.hp {
  display: none;
}

/* صندوق الملاحظات */
.notes {
  margin: 24px 0;
  padding: 18px 22px;
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.1) 0%, rgba(15, 23, 42, 0.8) 100%);
  border: 1px solid rgba(245, 158, 11, 0.35);
  border-radius: 18px;
  font-size: 14px;
  color: #fde68a;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
}

.notes b {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  color: #fbbf24;
  margin-bottom: 6px;
}

.notes ol {
  margin: 6px 0 0;
  padding-inline-start: 22px;
  color: #cbd5e1;
}

/* الأزرار */
button {
  font: inherit;
  cursor: pointer;
  border: 0;
  border-radius: 16px;
  padding: 14px 28px;
  background: linear-gradient(135deg, var(--neon-emerald) 0%, var(--neon-cyan) 100%);
  color: #fff;
  font-weight: 800;
  font-size: 16px;
  box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

#sb {
  width: 100%;
  padding: 16px;
  font-size: 18px;
  letter-spacing: 0.5px;
}

button:hover:not(:disabled) {
  transform: translateY(-3px);
  box-shadow: 0 12px 30px rgba(16, 185, 129, 0.55), 0 0 15px rgba(6, 182, 212, 0.4);
}

button:active:not(:disabled) {
  transform: scale(0.98);
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

button.l {
  background: rgba(30, 41, 59, 0.8);
  color: #38bdf8;
  border: 1px solid rgba(56, 189, 248, 0.4);
  padding: 8px 16px;
  font-size: 14px;
  box-shadow: none;
}

button.l:hover {
  background: rgba(56, 189, 248, 0.15);
  box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
}

/* الرسائل والتنبيهات */
.msg {
  margin: 16px 0;
  padding: 14px 18px;
  border-radius: 14px;
  display: none;
  font-weight: 600;
}

.msg.e {
  display: block;
  background: rgba(244, 63, 94, 0.15);
  border: 1px solid rgba(244, 63, 94, 0.4);
  color: #fda4af;
}

.msg.i {
  display: block;
  background: rgba(16, 185, 129, 0.15);
  border: 1px solid rgba(16, 185, 129, 0.4);
  color: #6ee7b7;
}

/* شاشة النجاح */
.done {
  text-align: center;
  padding: 50px 20px;
  display: none;
  background: var(--glass-bg);
  border: 1px solid rgba(16, 185, 129, 0.4);
  border-radius: 24px;
  backdrop-filter: blur(16px);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(16, 185, 129, 0.2);
}

.done h2 {
  background: none;
  border: 0;
  color: var(--neon-emerald);
  font-size: 26px;
  justify-content: center;
  box-shadow: none;
}

.done p {
  color: var(--text-muted);
  font-size: 16px;
  margin-bottom: 24px;
}

/* نافذة عرض الصور المنبثقة */
#mdl {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(4, 8, 15, 0.88);
  backdrop-filter: blur(12px);
  overflow: auto;
  padding: 24px 14px;
  z-index: 99;
}

#mb {
  max-width: 660px;
  margin: 0 auto;
  color: #fff;
  text-align: center;
}

#mb div {
  font-weight: 700;
  color: var(--neon-emerald);
  margin-top: 12px;
  font-size: 16px;
}

#mb img {
  max-width: 100%;
  display: block;
  margin: 8px auto 22px;
  background: #0f172a;
  border-radius: 16px;
  border: 1px solid var(--glass-border);
  box-shadow: 0 15px 35px rgba(0,0,0,0.6);
}

@media(min-width: 700px) {
  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* لوحة الإدارة (#admin) */
#adm {
  display: none;
}

.bar {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  margin: 16px 0;
  padding: 16px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 18px;
}

.bar input {
  max-width: 280px;
}

.tw {
  overflow: auto;
  max-height: 72vh;
  border: 1px solid var(--glass-border);
  background: rgba(10, 16, 28, 0.9);
  border-radius: 18px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
}

table {
  border-collapse: collapse;
  font-size: 13px;
  white-space: nowrap;
  width: 100%;
}

th, td {
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  border-left: 1px solid rgba(255, 255, 255, 0.05);
  padding: 10px 12px;
  text-align: right;
}

th {
  background: #131f33;
  color: #38bdf8;
  font-weight: 700;
  position: sticky;
  top: 0;
  z-index: 2;
}

tr:hover {
  background: rgba(255, 255, 255, 0.03);
}

tr.ok {
  background: rgba(16, 185, 129, 0.14);
}
</style>
</head>
<body>
<div class="wrap">

<section id="pub">
 <header>
  <div class="hero-icon">
    <i class="fa-solid fa-shield-halved"></i>
  </div>
  <div>
    <h1>استمارة إضافة الطالب لنظام إدارة المعلومات التربوية (EMIS)</h1>
    <small>يرجى ملء البيانات بدقة والتأكد من مطابقتها للمستمسكات الرسمية</small>
  </div>
 </header>
 <form id="fm" novalidate></form>
 <div class="done" id="done">
  <h2><i class="fa-solid fa-circle-check"></i> تم استلام الاستمارة بنجاح</h2>
  <p>شكراً لك. سيتم تسجيل بيانات الطالب في النظام. لا حاجة لإرسالها مرة ثانية.</p>
  <button class="l" onclick="location.reload()"><i class="fa-solid fa-user-plus"></i> تسجيل طالب آخر</button>
 </div>
</section>

<section id="adm">
 <header>
  <div class="hero-icon"><i class="fa-solid fa-chart-pie"></i></div>
  <div><h1>لوحة الإدارة — سجل الردود</h1></div>
 </header>
 <div id="login" class="bar">
  <input id="pw" type="password" placeholder="أدخل كلمة المرور للإدارة">
  <button onclick="login()"><i class="fa-solid fa-right-to-bracket"></i> دخول</button>
 </div>
 <div id="lmsg" class="msg"></div>
 <div id="data" style="display:none">
  <div class="bar">
   <input id="q" placeholder="🔍 بحث بالاسم أو الرقم أو الصف">
   <button class="l" onclick="csv()"><i class="fa-solid fa-file-csv"></i> تنزيل Excel (CSV)</button>
   <span id="cnt" style="color:var(--neon-emerald);font-weight:700;margin-right:auto"></span>
  </div>
  <div class="tw"><table id="tb"></table></div>
 </div>
</section>

<div id="mdl" onclick="this.style.display='none'"><div id="mb"></div></div>
</div>

<script>
const URL_='https://efbkhyzaijlkmvmphmzq.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmYmtoeXphaWpsa212bXBobXpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMTc2OTYsImV4cCI6MjEwNjg5MzY5Nn0.vQqMvAJzjBziwwomQrKolcEGVbOydq6ZRAUt_0wt0h4';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const GR=['الأول الابتدائي','الثاني الابتدائي','الثالث الابتدائي','الرابع الابتدائي','الخامس الابتدائي','السادس الابتدائي'];

// أيقونات الأقسام لإعطاء مظهر عصري
const SEC_ICONS={
  'وثائق التعريف':'fa-id-card',
  'المعلومات الشخصية وبيانات الطالب':'fa-user-graduate',
  'تُملأ في حال كان للطالب هوية الأحوال المدنية':'fa-passport',
  'صور المستمسكات (اختياري — صورة واضحة من الهاتف)':'fa-camera-retro'
};

// [key,label,type(t/d/n/p/s),required,options] — عنصر بطول 1 = عنوان قسم
const F=[
['وثائق التعريف'],
['full_name','الاسم','t',1],['father_name','اسم الأب','t',1],['grandfather_name','اسم والد الأب','t',1],['great_grandfather_name','اسم جد الأب','t'],['surname','اللقب','t'],
['mother_name','اسم الأم','t',1],['mother_father_name','اسم والد الأم','t',1],['mother_grandfather_name','اسم جد الأم','t',1],
['birth_date','تاريخ التولد','d',1],['nationality','الجنسية','t',1],['national_id','رقم البطاقة الوطنية','n',1],
['المعلومات الشخصية وبيانات الطالب'],
['gender','الجنس','s',1,['ذكر','أنثى']],['birthplace','مسقط الرأس','t'],
['mother_tongue','اللغة الأم','s',1,['العربية','الكردية','التركمانية','السريانية','أخرى']],
['marital_status','الحالة الاجتماعية','s',0,['أعزب','متزوج']],
['blood_type','فئة الدم','s',0,['A+','A-','B+','B-','AB+','AB-','O+','O-']],
['religion','الديانة','s',1,['الإسلام','المسيحية','الصابئة المندائية','الإيزيدية','أخرى']],
['home_phone','رقم هاتف المنزل (ولي الأمر)','p',1],
['special_needs','الاحتياجات الخاصة (اكتب: لا يوجد)','t',1],
['economic_level','المستوى الاقتصادي','s',1,['تحت خط الفقر','فقيرة','متوسطة','عليا']],
['social_welfare','مشمول بمنحة الرعاية الاجتماعية؟','s',1,['نعم','كلا']],
['prev_result','نتيجة العام الدراسي السابق','s',1,['ناجح','راسب','تسجيل جديد']],
['grade','الصف الدراسي الحالي','s',1,GR],['section','الشعبة','s',1,['أ','ب']],
['address_district','العنوان (القضاء أو الناحية)','t',1],['city_village','المدينة / القرية','t'],
['neighborhood','الحي','t'],['mahalla','المحلة','t'],['alley','زقاق','t'],['landmark','أقرب نقطة دالة','t',1],
['تُملأ في حال كان للطالب هوية الأحوال المدنية'],
['civil_id_no','رقم هوية الأحوال المدنية','n'],['nationality_cert_no','رقم شهادة الجنسية','n'],
['registry_no','رقم السجل','n'],['page_no','رقم الصحيفة','n'],['issuer','جهة الإصدار','t'],
['صور المستمسكات (اختياري — صورة واضحة من الهاتف)'],
['id_front','البطاقة الموحدة — الوجه الأمامي','f'],['id_back','البطاقة الموحدة — الوجه الخلفي','f'],
['res_front','بطاقة السكن — الوجه الأمامي','f'],['res_back','بطاقة السكن — الوجه الخلفي','f']
];
const KL={id_front:'البطاقة الموحدة — أمامي',id_back:'البطاقة الموحدة — خلفي',res_front:'بطاقة السكن — أمامي',res_back:'بطاقة السكن — خلفي'};
const $=s=>document.querySelector(s);

function shrink(file){return new Promise((ok,no)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const sc=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.72))};img.onerror=no;img.src=u})}

/* ---------- نموذج الطلاب ---------- */
(function build(){
  let h='',open=false;
  F.forEach(f=>{
    if(f.length===1){
      if(open)h+='</div>';
      const ic=SEC_ICONS[f[0]]||'fa-layer-group';
      h+=`<h2><i class="fa-solid ${ic}"></i> ${f[0]}</h2><div class="grid">`;
      open=true;
      return;
    }
    const [k,l,t,r,o]=f,rq=r?' required':'';
    const inp=t==='f'?`<input name="f_${k}" type="file" accept="image/*">`:t==='s'
      ?`<select name="${k}"${rq}><option value="">اختر...</option>${o.map(x=>`<option>${x}</option>`).join('')}</select>`
      :`<input name="${k}"${rq} type="${t==='d'?'date':t==='p'?'tel':'text'}"${t==='n'||t==='p'?' inputmode="numeric"':''} autocomplete="off">`;
    h+=`<label class="f"><span>${l}${r?'<b>*</b>':''}</span>${inp}</label>`;
  });
  h+=`</div><input class="hp" name="website" tabindex="-1" autocomplete="off">
  <div class="notes"><b><i class="fa-solid fa-triangle-exclamation"></i> ملاحظات هامة</b><ol><li>يجب كتابة المعلومات بدقة وبخط واضح.</li><li>المعلومات المحددة بنجمة (*) يجب كتابتها.</li><li>إرفاق نسخة من مستمسكات الطالب (البطاقة الوطنية، بطاقة السكن).</li></ol></div>
  <div class="msg" id="err"></div><button id="sb" type="submit"><i class="fa-solid fa-paper-plane"></i> إرسال الاستمارة</button>`;
  $('#fm').innerHTML=h;
})();

$('#fm').onsubmit=async e=>{
  e.preventDefault();
  const fm=e.target,err=$('#err');err.className='msg';
  if(fm.website.value)return;
  const bad=[...fm.elements].find(x=>x.required&&!x.value.trim());
  if(bad){err.textContent='رجاءً أكمل الحقول الإلزامية (عليها نجمة).';err.className='msg e';bad.focus();return}
  const d={client_id:crypto.randomUUID()};
  new FormData(fm).forEach((v,k)=>{if(k!=='website'&&!k.startsWith('f_'))d[k]=String(v).trim()||null});
  $('#sb').disabled=true;
  try{
    const r=await fetch(URL_+'/rest/v1/student_submissions',{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(d)});
    if(r.ok){
      let fail=0;
      for(const el of fm.querySelectorAll('input[type=file]')){
        if(!el.files[0])continue;
        err.textContent='جاري رفع الصور… لا تغلق الصفحة';err.className='msg i';
        try{
          const data=await shrink(el.files[0]);
          const u=await fetch(URL_+'/rest/v1/student_files',{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({client_id:d.client_id,kind:el.name.slice(2),data})});
          if(!u.ok)fail++;
        }catch(x){fail++}
      }
      fm.style.display='none';$('#done').style.display='block';scrollTo(0,0);
      if(fail)$('#done p').textContent='تم استلام الاستمارة، لكن تعذّر رفع '+fail+' صورة. سلّم نسخة المستمسكات لإدارة المدرسة.';
      return;
    }
    err.textContent=r.status===409?'هذا الرقم الوطني مسجّل مسبقاً. إذا تحتاج تعديل، راجع إدارة المدرسة.':'صار خطأ بالإرسال، حاول مرة ثانية.';
  }catch(x){err.textContent='لا يوجد اتصال بالإنترنت، حاول مرة ثانية.'}
  err.className='msg e';$('#sb').disabled=false;
};

/* ---------- لوحة الإدارة (#admin) ---------- */
let rows=[],PW='';
function route(){const a=location.hash==='#admin';$('#pub').style.display=a?'none':'block';$('#adm').style.display=a?'block':'none'}
addEventListener('hashchange',route);route();

async function login(){
  PW=$('#pw').value;const m=$('#lmsg');m.className='msg';
  const r=await fetch(URL_+'/rest/v1/rpc/admin_list',{method:'POST',headers:H,body:JSON.stringify({pw:PW})});
  if(!r.ok){m.textContent='كلمة السر غير صحيحة.';m.className='msg e';return}
  rows=await r.json();$('#login').style.display='none';$('#data').style.display='block';draw();
}
const fields=F.filter(f=>f.length>1&&f[2]!=='f');
function draw(){
  const q=$('#q').value.trim(),v=rows.filter(r=>!q||Object.values(r).join(' ').includes(q));
  $('#cnt').textContent=`العدد: ${v.length} من ${rows.length}`;
  const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  $('#tb').innerHTML='<tr><th>أُدخل بالإيمس</th><th>الصور</th>'+fields.map(f=>`<th>${f[1]}</th>`).join('')+'<th>وقت الإرسال</th></tr>'+
   v.map(r=>`<tr class="${r.entered?'ok':''}"><td><input type="checkbox" style="width:18px;height:18px;accent-color:#10b981" ${r.entered?'checked':''} onchange="mark(${r.id},this.checked)"></td><td>${r.client_id?`<button class="l" onclick="imgs('${r.client_id}')"><i class="fa-regular fa-images"></i> عرض</button>`:''}</td>`+
   fields.map(f=>`<td>${esc(r[f[0]])}</td>`).join('')+`<td>${esc(r.created_at.slice(0,16).replace('T',' '))}</td></tr>`).join('');
}
$('#q').oninput=draw;
async function imgs(cid){
  const r=await fetch(URL_+'/rest/v1/rpc/admin_files',{method:'POST',headers:H,body:JSON.stringify({pw:PW,cid})});
  if(!r.ok){alert('تعذّر جلب الصور');return}
  const a=await r.json();
  $('#mb').innerHTML=a.length?a.map(x=>`<div>${KL[x.kind]||x.kind}</div><img src="${x.data}">`).join(''):'<p>لا توجد صور لهذا الطالب</p>';
  $('#mdl').style.display='block';
}
async function mark(id,val){
  const r=await fetch(URL_+'/rest/v1/rpc/admin_mark',{method:'POST',headers:H,body:JSON.stringify({pw:PW,sid:id,val})});
  if(r.ok){rows.find(x=>x.id===id).entered=val;draw()}else alert('تعذّر الحفظ');
}
function csv(){
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const out=[['أُدخل بالإيمس',...fields.map(f=>f[1]),'وقت الإرسال'].map(q).join(',')];
  rows.forEach(r=>out.push([r.entered?'نعم':'',...fields.map(f=>r[f[0]]),r.created_at].map(q).join(',')));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+out.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download='students-emis.csv';a.click();
}
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script>
