<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إدارة المدرسة</title>
<link rel="manifest" href="app-manifest.json">
<meta name="theme-color" content="#0b1220">
<link rel="icon" href="app-icon-192.png">
<link rel="apple-touch-icon" href="app-icon-192.png">
<style>
:root{--bg:#070d1a;--card:rgba(255,255,255,.06);--tx:#eaf1ff;--mu:#8fa0c0;--pr:#2dd4bf;--bd:rgba(255,255,255,.1);color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#eef3fb;--card:#fff;--tx:#0f1a33;--mu:#62708f;--pr:#0f9d8a;--bd:#dce5f3;color-scheme:light}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;color:var(--tx);font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;padding:calc(30px + env(safe-area-inset-top,0px)) 18px calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;background:radial-gradient(600px 380px at 85% -5%,rgba(20,184,166,.35),transparent 65%),radial-gradient(560px 360px at 5% 8%,rgba(37,99,235,.35),transparent 65%),var(--bg);background-attachment:fixed}
.logo{width:92px;height:92px;border-radius:26px;margin-bottom:12px;box-shadow:0 0 36px rgba(45,212,191,.45)}
h1{font-size:27px;font-weight:800;margin-bottom:4px;text-shadow:0 0 22px rgba(45,212,191,.35)}
p.s{color:var(--mu);font-size:15px;margin-bottom:18px;text-align:center}
#box{width:100%;max-width:430px;display:grid;gap:13px}
a.c{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:18px;text-decoration:none;color:var(--tx);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .15s}
a.c:active{transform:scale(.97)}
a.c:first-of-type{padding:22px 18px;border-color:rgba(45,212,191,.45);box-shadow:0 0 26px rgba(45,212,191,.22)}
.e{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1;flex:none;background:linear-gradient(135deg,#2563eb,#7c3aed)}
a.c:nth-of-type(2) .e{background:linear-gradient(135deg,#7c3aed,#db2777)}
a.c:nth-of-type(3) .e{background:linear-gradient(135deg,#0ea5e9,#14b8a6)}
a.c:nth-of-type(4) .e{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.c b{display:block;font-size:19px;margin-bottom:3px}
.c span{color:var(--mu);font-size:13px}
.c span.e{color:#fff}
input,button{width:100%;padding:14px;border-radius:16px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;backdrop-filter:blur(10px)}
button{background:linear-gradient(135deg,#2563eb,#14b8a6);color:#fff;border:0;font-weight:700;box-shadow:0 8px 22px rgba(20,184,166,.28)}
button.l{background:var(--card);color:var(--pr);border:1px solid var(--bd);box-shadow:none}
.w{background:rgba(251,191,36,.13);color:#fbbf24;border:1px solid rgba(251,191,36,.25);border-radius:18px;padding:14px;font-size:14px;line-height:1.7}
.u{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu);gap:10px}
.u span{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:7px 12px}
.u a{color:#f87171}
#ms{text-align:center;color:#f87171;font-size:13px;min-height:18px}
</style>
</head>
<body>
<img class="logo" src="app-icon-192.png" alt="">
<h1>إدارة المدرسة</h1>
<p class="s" id="sub">جاري التحميل…</p>
<div id="box"></div>
<script type="module">
import {initializeApp,getApps,getApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const OWNER='077057n@gmail.com';
const app=getApps().length?getApp():initializeApp({apiKey:"AIzaSyBkyhe6WrXrBz_jraFt1O0aIW5UoI-oE_g",authDomain:"grades-record-1a3bd.firebaseapp.com",projectId:"grades-record-1a3bd",storageBucket:"grades-record-1a3bd.firebasestorage.app",messagingSenderId:"250496527897",appId:"1:250496527897:web:98d1eedf8b62695f1f0488"});
const auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean=s=>String(s||'').replace(/[\s\u200B-\u200F\u202A-\u202E\u2066-\u2069\uFEFF]/g,'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).toLowerCase();
const ERR={'auth/invalid-credential':'الإيميل أو كلمة المرور غير صحيحة، وإذا ما عندك حساب اضغط «إنشاء حساب جديد»','auth/wrong-password':'كلمة المرور غير صحيحة','auth/user-not-found':'لا يوجد حساب بهذا الإيميل','auth/email-already-in-use':'هذا الإيميل مسجّل مسبقاً، اضغط دخول','auth/weak-password':'كلمة المرور قصيرة (6 أحرف على الأقل)','auth/invalid-email':'صيغة الإيميل غير صحيحة','auth/network-request-failed':'لا يوجد اتصال بالإنترنت','auth/too-many-requests':'محاولات كثيرة، انتظر قليلاً'};
const msg=t=>{const e=$('#ms');if(e)e.textContent=t};
const go=async f=>{try{await f()}catch(e){msg(ERR[e.code]||'تعذر: '+(e.code||e.message))}};
window.lg=()=>go(()=>signInWithEmailAndPassword(auth,clean($('#em').value),$('#pw').value));
window.su=()=>go(()=>createUserWithEmailAndPassword(auth,clean($('#em').value),$('#pw').value));
window.fp=()=>go(async()=>{const e=clean($('#em').value);if(!e)return msg('اكتب الإيميل أولاً');await sendPasswordResetEmail(auth,e);msg('أرسلنا رابط تغيير كلمة المرور لإيميلك 📧')});
window.out=()=>signOut(auth);

function loginView(){
 $('#sub').textContent='سجّل دخولك لتظهر لك صلاحياتك';
 $('#box').innerHTML='<input id="em" type="email" dir="ltr" placeholder="الإيميل" autocomplete="email"><input id="pw" type="password" dir="ltr" placeholder="كلمة المرور (6 أحرف على الأقل)"><button onclick="lg()">دخول</button><button class="l" onclick="su()">إنشاء حساب جديد</button><button class="l" onclick="fp()">نسيت كلمة المرور</button><p id="ms"></p>';
}
async function roleOf(u){
 const em=(u.email||'').toLowerCase(),ck='app_role_'+u.uid;
 if(em===OWNER)return {owner:true};
 try{
  const [t,v]=await Promise.all([getDoc(doc(db,'teachers',em)),getDoc(doc(db,'viewers',em))]);
  const r={teacher:t.exists(),guide:t.exists()&&!!t.data().guide,viewer:v.exists()};
  try{localStorage.setItem(ck,JSON.stringify(r))}catch(e){}
  return r;
 }catch(e){
  try{const c=JSON.parse(localStorage.getItem(ck));if(c)return c}catch(x){}
  return {offline:true};
 }
}
const card=(href,e,t,s)=>`<a class="c" href="${href}"><span class="e">${e}</span><div><b>${t}</b><span>${s}</span></div></a>`;
async function home(u){
 $('#sub').textContent='جاري تحديد صلاحياتك…';
 const r=await roleOf(u),o=!!r.owner;
 const label=o?'المالك':[r.teacher&&'معلم',r.guide&&'مرشد صف',r.viewer&&'معاون'].filter(Boolean).join(' · ');
 let h=`<div class="u"><span>${esc(u.email)}${label?' — '+label:''}</span><a href="#" onclick="out();return false">خروج</a></div>`;
 if(o||r.teacher)h+=card('teacher-app.html','👨‍🏫','دفتر المعلم','الطلاب والحضور والدرجات والسلوك والملاحظات');
 if(o||r.guide)h+=card('grades-record.html','📝','سجل الدرجات','لمرشد الصف: السجل النهائي والنواقص والطباعة');
 if(o||r.viewer)h+=card('admin.html#gr','📊','متابعة الدرجات','سجلات كل الشعب والمعلمين');
 if(o)h+=card('admin.html','⚙️','إدارة المدرسة','استيراد الطلاب وتخصيص المعلمين والمعاونين');
 if(!o&&!r.teacher&&!r.guide&&!r.viewer)h+=`<div class="w">${r.offline?'تعذر الاتصال بالإنترنت لتحديد صلاحياتك. جرّب مرة ثانية.':'حسابك غير مفعّل بعد. أرسل إيميلك للمدير ليحدد صلاحياتك، وبعدها حدّث الصفحة.'}</div><button class="l" onclick="location.reload()">🔄 تحديث</button>`;
 $('#sub').textContent=o?'أهلاً بك يا مدير':'اختر ما تريد';
 $('#box').innerHTML=h;
}
onAuthStateChanged(auth,u=>{u?home(u):loginView()});
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
