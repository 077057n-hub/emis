<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سجل الدرجات</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b6fb6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
<style>
:root{--bg:#eef3f8;--card:#fff;--tx:#1c2a3a;--mu:#6a7d92;--pr:#3b6fb6;--pl:#dce8f7;--bd:#dbe4ef}
@media(prefers-color-scheme:dark){:root{--bg:#10161e;--card:#19222d;--tx:#e4ebf3;--mu:#8da0b5;--pr:#7aa7e6;--pl:#233752;--bd:#2a3948}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 8px}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:21px}
main{padding:4px 14px}
.row{display:flex;gap:8px;margin:8px 0}
select,input,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0}
.b{display:block;width:100%;padding:12px;border:0;border-radius:12px;background:var(--pr);color:#fff;font:inherit;font-weight:700;margin:6px 0;text-align:center}
.row .b{margin:0;padding:10px 4px;font-size:13px}
.b.g{background:var(--pl);color:var(--pr)}
.ic{border:0;background:var(--card);border-radius:12px;min-width:44px;height:44px;font-size:20px;box-shadow:0 1px 3px #0002}
.ic.s{box-shadow:none;background:none;min-width:36px}
.card{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:11px 12px;margin:8px 0}
.card b{flex:1;font-weight:600}
.n{background:var(--pl);color:var(--pr);border-radius:8px;min-width:28px;text-align:center;padding:2px 0;font-size:13px}
.mu{color:var(--mu);font-size:12px}
.gi{width:76px;margin:0;text-align:center;font-weight:700}
.tw{overflow-x:auto;background:var(--card);border-radius:14px;margin-top:8px}
table{border-collapse:collapse;min-width:960px;width:100%}
th,td{padding:7px 4px;text-align:center;border:1px solid var(--bd);font-size:13px}
th{background:var(--pl);color:var(--pr);font-size:12px}
td:first-child,th:first-child{position:sticky;right:0;background:var(--card);text-align:right;min-width:96px;padding-right:8px;z-index:1}
th:first-child{background:var(--pl)}
td.c{font-weight:700;background:var(--bg)}
td.f{color:#d23f37}
.pill{border-radius:20px;padding:3px 12px;font-size:13px;background:var(--pl);color:var(--pr);font-weight:700}
.pill.ok{background:#d8f1e0;color:#1f7a3d}
.pill.wn{background:#fdecc8;color:#8a5a00}
.pill.neg{background:#f8dcda;color:#a73832}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:8px 0;color:var(--mu);font:inherit;font-size:11px}
nav button span{display:block;font-size:22px}
nav .on{color:var(--pr);font-weight:700}
.ov{position:fixed;inset:0;background:#0007;z-index:9;display:flex;align-items:flex-end}
.sh{background:var(--card);width:100%;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sh h3{margin-bottom:6px}
.warn{background:#fdf0cf;color:#6f5000;border-radius:12px;padding:10px;font-size:13px;margin-top:8px}
.empty{text-align:center;color:var(--mu);padding:44px 0}
.empty div{font-size:48px}
.t{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:20;font-size:14px}
.days{display:flex;gap:6px;overflow-x:auto;margin:8px 0}
.days button{flex:none;padding:10px 12px;border:0;border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-size:13px}
.days .on{background:var(--pr);color:#fff;font-weight:700}
.chips{display:flex;gap:8px;margin:8px 0}
.chips span{flex:1;text-align:center;background:var(--card);border-radius:12px;padding:8px;font-size:14px}
hr{border:0;border-top:1px solid var(--bd);margin:12px 0}
#pr{display:none}
@page{size:A4 landscape;margin:8mm}
@media print{#app,nav,.ov,.t{display:none!important}body{background:#fff;padding:0}#pr{display:block;background:#fff;color:#000}.pg{page-break-after:always}#pr table{border-collapse:collapse;width:100%;font-size:12px}#pr td,#pr th{border:1px solid #000;padding:7px 2px;text-align:center}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const E0=()=>({cl:[],st:[],g:{},cur:null,lb:0});
const SUBS=['التربية الإسلامية','اللغة العربية','اللغة الإنكليزية','الرياضيات','الاجتماعيات','العلوم','الحاسوب','اللغة الفرنسية','التربية الفنية والنشيد','التربية الرياضية'];
const DEF=[0,1,2,3,4,5,8,9].map(i=>SUBS[i]);
const CO=['تشرين 1','تشرين 2','كانون 1','كانون 2','نصف السنة','شباط','آذار','نيسان','أيار','النهائي','الدور الثاني'];
const HD=['تشرين 1','تشرين 2','كانون 1','كانون 2','معدل ن1','نصف السنة','شباط','آذار','نيسان','أيار','معدل ن2','المعدل السنوي','الامتحانات النهائية','الدرجة النهائية','الدور الثاني','الدرجة الأخيرة'];
let D=E0(),tab='st',EX={s:null,c:0},SH=null,Q='';
try{Object.assign(D,JSON.parse(localStorage.getItem('sj')||'{}'))}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const save=()=>{D.lm=Date.now();try{localStorage.setItem('sj',JSON.stringify(D))}catch(e){toast('تعذر الحفظ!')}window.cloudPush&&window.cloudPush()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const C=()=>D.cl.find(c=>c.id===D.cur);
const S=()=>D.st.filter(s=>s.c===D.cur).sort((a,b)=>a.no-b.no);
const cname=c=>c.g+' / '+c.s;
const empty=(i,t)=>`<div class="empty"><div>${i}</div><p>${t}</p></div>`;
function toast(t){const e=document.createElement('div');e.className='t';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function modal(t,body,ok,txt){
 const m=document.createElement('div');m.className='ov';
 m.innerHTML=`<div class="sh"><h3>${t}</h3><div>${body}</div><div class="row">${ok?`<button class="b" id="mo">${txt||'حفظ'}</button>`:''}<button class="b g" id="mc">${ok?'إلغاء':'إغلاق'}</button></div></div>`;
 document.body.appendChild(m);
 m.querySelector('#mc').onclick=()=>m.remove();
 if(ok)m.querySelector('#mo').onclick=()=>{if(ok(m)!==false)m.remove()};
 m.onclick=e=>{if(e.target===m)m.remove()};
 return m;
}
const ask=(t,fn)=>modal('تأكيد',`<p>${t}</p>`,()=>{fn()},'نعم');
const v=(m,s)=>m.querySelector(s).value.trim();

/* ---------- السحابة (Firebase) ---------- */
const CL={user:null,st:''};
const ind=()=>!CL.user?'':CL.st==='ok'?'✅':CL.st==='err'?'⚠️':'🔄';
const cbh=()=>'☁️'+(ind()?'<small style="font-size:11px">'+ind()+'</small>':'');
const paint=()=>{const b=$('#cb');if(b)b.innerHTML=cbh()};
const stTxt=()=>CL.st==='ok'?'✅ بياناتك محفوظة بالسحابة':CL.st==='err'?'⚠️ تعذرت المزامنة، ستُعاد عند رجوع الاتصال':'🔄 بانتظار المزامنة';
const getD=()=>D;
function applyCloud(o){try{localStorage.setItem('sj_prev',JSON.stringify(D))}catch(e){}D=Object.assign(E0(),o);try{localStorage.setItem('sj',JSON.stringify(D))}catch(e){}render()}
const ERR={'auth/invalid-credential':'الإيميل أو كلمة المرور غير صحيحة','auth/wrong-password':'كلمة المرور غير صحيحة','auth/user-not-found':'لا يوجد حساب بهذا الإيميل','auth/email-already-in-use':'هذا الإيميل مسجّل مسبقاً، اضغط دخول','auth/weak-password':'كلمة المرور قصيرة (6 أحرف على الأقل)','auth/invalid-email':'صيغة الإيميل غير صحيحة','auth/network-request-failed':'لا يوجد اتصال بالإنترنت','auth/too-many-requests':'محاولات كثيرة، انتظر قليلاً'};
async function ca(kind){const e=$('#cem').value.trim(),p=$('#cpw').value;
 if(!e)return toast('اكتب الإيميل');
 try{
  if(kind==='reset'){await cloud.reset(e);return toast('أرسلنا رابط تغيير كلمة المرور لإيميلك 📧')}
  if(!p)return toast('اكتب كلمة المرور');
  await cloud[kind](e,p);document.querySelectorAll('.ov').forEach(x=>x.remove());toast('تم تسجيل الدخول ✅')
 }catch(x){toast(ERR[x.code]||'تعذر: '+(x.code||x.message))}}
function cloudUI(){
 if(!window.cloud)return toast(window.CFAIL?'تعذر تحميل السحابة، تأكد من الإنترنت':'السحابة غير مفعّلة بعد');
 if(CL.user)return modal('☁️ حسابك',`<p><b dir="ltr">${esc(CL.user)}</b></p><p class="mu" id="cst">${stTxt()}</p><p class="mu">بياناتك تتزامن تلقائياً مع كل تعديل، وتنزل على أي جهاز تدخل منه بنفس الإيميل.</p><button class="b" onclick="cloud.sync();toast('جاري المزامنة 🔄')">🔄 مزامنة الآن</button><button class="b g" onclick="cloud.out();document.querySelectorAll('.ov').forEach(x=>x.remove())">🚪 تسجيل الخروج</button>`);
 modal('☁️ تسجيل الدخول',`<p class="mu">سجّل بالإيميل حتى تنحفظ بياناتك بالسحابة ولا تضيع. التطبيق يشتغل بدون تسجيل أيضاً.</p><input id="cem" type="email" inputmode="email" autocomplete="email" placeholder="الإيميل" dir="ltr"><input id="cpw" type="password" autocomplete="current-password" placeholder="كلمة المرور (6 أحرف على الأقل)" dir="ltr"><button class="b" onclick="ca('login')">دخول</button><button class="b g" onclick="ca('signup')">إنشاء حساب جديد</button><button class="b g" onclick="ca('reset')">نسيت كلمة المرور</button>`);
}
function cloudAsk(c,res){
 const m=modal('☁️ يوجد بيانات بالجهاز وبالسحابة',`<p>اختر النسخة التي تريد الاحتفاظ بها.</p><p class="mu">السحابة: ${(c.st||[]).length} طالب · الجهاز: ${D.st.length} طالب</p><p class="mu">إذا اخترت السحابة تنحفظ نسخة من بيانات الجهاز داخل الجهاز. وإذا اخترت الجهاز تُستبدل بيانات السحابة.</p><button class="b" id="pc">☁️ استخدم بيانات السحابة</button><button class="b g" id="pl">📱 استخدم بيانات الجهاز</button>`);
 m.querySelector('#pc').onclick=()=>{m.remove();res('cloud')};
 m.querySelector('#pl').onclick=()=>{m.remove();res('local')};
}

/* ---------- الحساب (مطابق للورقة) ---------- */
const num=x=>x===undefined||x===null||x===''||isNaN(+x)?null:+x;
const mean=a=>{a=a.filter(x=>x!==null);return a.length?Math.round(a.reduce((p,q)=>p+q,0)/a.length):null};
function calc(id,sb){
 const g=(D.g[id+'|'+sb]||[]).map(num),G=i=>num(g[i]);
 const a1=mean([G(0),G(1),G(2),G(3)]),a2=mean([G(5),G(6),G(7),G(8)]);
 const annual=mean([a1,G(4),a2]),fe=G(9);
 const final=annual!==null&&fe!==null?Math.round((annual+fe)/2):null;
 const sec=G(10);
 return {g,a1,a2,annual,fe,final,sec,eff:sec!==null?sec:final};
}
function res(id){let n=0,any=false;(C().sub||[]).forEach(sb=>{const k=calc(id,sb);if(k.eff!==null){any=true;if(k.eff<50)n++}});
 return {n,t:!any?'—':n===0?'ناجح':n<=3?'إكمال':'راسب'};}
const pc=t=>t==='ناجح'?'ok':t==='إكمال'?'wn':t==='راسب'?'neg':'';

/* ---------- الطلاب ---------- */
function list(){const q=Q.trim();return S().filter(s=>!q||s.n.includes(q)||(s.adm||'').includes(q)).map(s=>`<div class="card"><span class="n">${s.no}</span><b>${esc(s.n)}<br><span class="mu">رقم القبول: ${esc(s.adm||'—')}</span>${s.nt?` <span class="pill wn">${esc(s.nt)}</span>`:''}</b><button class="ic s" onclick="editS('${s.id}')">✏️</button><button class="ic s" onclick="delS('${s.id}')">🗑</button></div>`).join('')||empty('👥','لا يوجد طلاب');}
function vSt(){const c=C();
 return `<div class="row"><button class="b" onclick="addS()">➕ طلاب</button><button class="b g" onclick="subj()">📚 المواد</button><button class="b g" onclick="clsForm(C())">✏️ تعديل</button><button class="b g" onclick="delC()">🗑 حذف</button></div>`
 +(c?`<input placeholder="🔍 بحث بالاسم أو رقم القبول" value="${esc(Q)}" oninput="Q=this.value;$('#ul').innerHTML=list()"><div id="ul">${list()}</div>`:empty('📒','أضف شعبة من زر ➕ بالأعلى'));}
function addS(){if(!D.cur)return toast('أضف شعبة أولاً ➕');
 modal('➕ إضافة طلاب',`<p class="mu">اكتب كل طالب بسطر: الاسم | رقم القبول | ملاحظة (الأخيران اختياريان)<br>مثال: أحمد علي | 21/58 | انتقل</p><textarea id="ns" rows="8"></textarea>`,m=>{
  let no=Math.max(0,...S().map(s=>s.no));
  v(m,'#ns').split('\n').map(x=>x.trim()).filter(Boolean).forEach(l=>{const p=l.split(/[|\t]/).map(x=>x.trim());D.st.push({id:uid(),c:D.cur,n:p[0],adm:p[1]||'',nt:p[2]||'',no:++no})});save();render()});}
function editS(id){const s=D.st.find(x=>x.id===id);
 modal('✏️ بيانات الطالب',`<input id="en" value="${esc(s.n)}" placeholder="الاسم"><input id="ea" value="${esc(s.adm||'')}" placeholder="رقم القبول (مثال: 21/58)"><input id="et" value="${esc(s.nt||'')}" placeholder="ملاحظات (مثال: انتقل)">`,m=>{
  if(!v(m,'#en'))return false;s.n=v(m,'#en');s.adm=v(m,'#ea');s.nt=v(m,'#et');save();render()});}
const rmS=id=>{D.st=D.st.filter(s=>s.id!==id);Object.keys(D.g).forEach(k=>k.startsWith(id+'|')&&delete D.g[k])};
const delS=id=>ask('حذف الطالب وكل درجاته؟',()=>{rmS(id);save();render()});
function clsForm(c){if(c===undefined&&false)return;
 modal(c?'✏️ تعديل الشعبة':'➕ شعبة جديدة',`<select id="g">${['الخامس','السادس'].map(x=>`<option${c&&c.g===x?' selected':''}>${x}</option>`).join('')}</select><input id="s" placeholder="الشعبة (مثال: أ)" value="${c?esc(c.s):''}">`,m=>{
  const g=v(m,'#g'),s=v(m,'#s')||'—';
  if(c){c.g=g;c.s=s}else{const n={id:uid(),g,s,sub:[...DEF]};D.cl.push(n);D.cur=n.id}
  save();render()});}
const delC=()=>{if(!C())return;ask('حذف الشعبة مع كل طلابها ودرجاتهم؟',()=>{S().forEach(s=>rmS(s.id));D.cl=D.cl.filter(c=>c.id!==D.cur);D.cur=null;save();render()})};
function subj(){const c=C();if(!c)return toast('أضف شعبة أولاً ➕');
 const all=[...new Set([...SUBS,...c.sub])];
 modal('📚 مواد الشعبة',all.map(x=>`<label class="card"><input type="checkbox" value="${esc(x)}"${c.sub.includes(x)?' checked':''} style="width:22px;margin:0"><b>${esc(x)}</b></label>`).join('')+`<input id="nsub" placeholder="مادة أخرى (اختياري)">`,m=>{
  c.sub=[...m.querySelectorAll('input[type=checkbox]:checked')].map(i=>i.value);
  const n=v(m,'#nsub');if(n&&!c.sub.includes(n))c.sub.push(n);save();render()});}

/* ---------- إدخال الدرجات ---------- */
const fs=id=>{const k=calc(id,EX.s);return `سنوي ${k.annual??'–'} · نهائي ${k.final??'–'}`};
function vIn(){const c=C();if(!c)return empty('✏️','أضف شعبة أولاً ➕');
 if(!c.sub.length)return empty('📚','اختر مواد الشعبة من تبويب الطلاب');
 if(!c.sub.includes(EX.s))EX.s=c.sub[0];
 return `<select onchange="EX.s=this.value;render()">${c.sub.map(x=>`<option${x===EX.s?' selected':''}>${esc(x)}</option>`).join('')}</select>`
 +`<div class="days">${CO.map((x,i)=>`<button class="${i===EX.c?'on':''}" onclick="EX.c=${i};render()">${x}</button>`).join('')}</div>`
 +(S().map(s=>`<div class="card"><span class="n">${s.no}</span><b>${esc(s.n)}<br><span class="mu" id="f${s.id}">${fs(s.id)}</span></b><input class="gi" type="number" inputmode="decimal" min="0" max="100" value="${(D.g[s.id+'|'+EX.s]||[])[EX.c]??''}" oninput="sg('${s.id}',this.value)"></div>`).join('')||empty('👥','لا يوجد طلاب'));}
function sg(id,x){const k=id+'|'+EX.s;(D.g[k]=D.g[k]||[])[EX.c]=x;save();const e=$('#f'+id);if(e)e.textContent=fs(id)}

/* ---------- سجل الطالب ---------- */
function vSh(){const L=S(),c=C();if(!c||!L.length)return empty('📋','لا يوجد طلاب');
 if(!L.find(s=>s.id===SH))SH=L[0].id;const st=L.find(s=>s.id===SH),r=res(SH);
 const rows=c.sub.map(sb=>{const k=calc(SH,sb),g=k.g;
  const cells=[g[0],g[1],g[2],g[3],k.a1,g[4],g[5],g[6],g[7],g[8],k.a2,k.annual,k.fe,k.final,g[10],k.sec];
  return `<tr><td>${esc(sb)}</td>${cells.map((x,i)=>{x=num(x);const cc=[4,10,11,13,15].includes(i),f=(i===13&&x!==null&&x<50&&k.sec===null)||(i===15&&x!==null&&x<50);return `<td class="${cc?'c':''}${f?' f':''}">${x===null?'':x}</td>`}).join('')}</tr>`}).join('');
 return `<select onchange="SH=this.value;render()">${L.map(s=>`<option value="${s.id}"${s.id===SH?' selected':''}>${s.no} - ${esc(s.n)}</option>`).join('')}</select>`
 +`<div class="chips"><span>${esc(cname(c))}</span><span>رقم ${esc(st.adm||st.no)}</span><span>راسب بـ ${r.n}</span><span><b class="pill ${pc(r.t)}">${r.t}</b></span></div>`
 +`<div class="tw"><table><tr><th>الدروس</th>${HD.map(h=>`<th>${h}</th>`).join('')}</tr>${rows}</table></div>`
 +`<p class="mu" style="margin-top:8px">الأرقام الغامقة تُحسب تلقائياً. الأحمر = أقل من 50.</p>`;}

/* ---------- النتائج ---------- */
function vRs(){const L=S();if(!C()||!L.length)return empty('📊','لا يوجد طلاب');
 const R=L.map(s=>({s,r:res(s.id)})),c=t=>R.filter(x=>x.r.t===t).length;
 return `<div class="chips"><span>✅ ${c('ناجح')}</span><span>🔄 ${c('إكمال')}</span><span>❌ ${c('راسب')}</span></div>`
 +R.map(({s,r})=>`<div class="card" onclick="SH='${s.id}';tab='sh';render();scrollTo(0,0)"><span class="n">${s.no}</span><b>${esc(s.n)}</b><span class="mu">راسب بـ ${r.n}</span><span class="pill ${pc(r.t)}">${r.t}</span></div>`).join('')
 +`<p class="mu">ناجح: لا مواد راسبة · إكمال: 1 إلى 3 مواد · راسب: أكثر من 3 مواد. تُحسب فقط المواد التي أُدخلت امتحاناتها النهائية.</p>`;}

/* ---------- النسخ الاحتياطي ---------- */
const dump=()=>JSON.stringify({v:1,t:Date.now(),D});
const fname=()=>'grades-backup-'+today()+'.json';
const done=()=>{D.lb=Date.now();save();render()};
async function shr(){try{const f=new File([dump()],fname(),{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'نسخة سجل الدرجات'});done();toast('تمت المشاركة ✅')}else dl()}catch(e){if(e.name!=='AbortError')dl()}}
function dl(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([dump()],{type:'application/json'}));a.download=fname();document.body.appendChild(a);a.click();a.remove();done();toast('تم التنزيل ✅')}catch(e){toast('استخدم زر نسخ كنص')}}
async function cp(){try{await navigator.clipboard.writeText(dump());done();toast('تم النسخ — الصقه بتيليجرام ✅')}catch(e){toast('تعذر النسخ، جرّب المشاركة')}}
function rt(t){try{const o=JSON.parse(t);if(!o.D||(o.D.cl||[]).some(c=>!c.sub))throw 0;ask('سيتم استبدال كل البيانات الحالية. متأكد؟',()=>{D=Object.assign(E0(),o.D);save();document.querySelectorAll('.ov').forEach(x=>x.remove());render();toast('تم الاسترجاع ✅')})}catch(e){toast('الملف غير صالح')}}
const rf=f=>f&&f.text().then(rt);
const bk=()=>modal('💾 النسخ الاحتياطي',`<p class="mu">بياناتك محفوظة على هذا الجهاز. خذ نسخة كل أسبوع وأرسلها لنفسك على تيليجرام حتى ما تضيع لو حذفت التطبيق أو غيرت الهاتف.</p>
<button class="b" onclick="shr()">📤 مشاركة النسخة (تيليجرام / واتساب / درايف)</button>
<button class="b g" onclick="dl()">⬇️ تنزيل كملف</button>
<button class="b g" onclick="cp()">📋 نسخ كنص</button><hr>
<label class="b g">📥 استرجاع من ملف<input type="file" accept=".json,application/json" hidden onchange="rf(this.files[0])"></label>
<textarea id="pt" rows="3" placeholder="أو الصق نص النسخة هنا"></textarea>
<button class="b g" onclick="rt($('#pt').value)">استرجاع من النص</button>`);

/* ---------- التصدير (PDF / Excel) ---------- */
const YR=()=>{const d=new Date(),y=d.getFullYear();return d.getMonth()>=8?y+' / '+(y+1):(y-1)+' / '+y};
const cellsOf=(id,sb)=>{const k=calc(id,sb),g=k.g;return [g[0],g[1],g[2],g[3],k.a1,g[4],g[5],g[6],g[7],g[8],k.a2,k.annual,k.fe,k.final,g[10],k.sec].map(num)};
function sheetHTML(s,yr){const c=C(),r=res(s.id);
 const rows=c.sub.map(sb=>`<tr><td align="right"><b>${esc(sb)}</b></td>${cellsOf(s.id,sb).map(x=>`<td align="center">${x===null?'':x}</td>`).join('')}</tr>`).join('');
 return `<table border="1" cellspacing="0" cellpadding="4" dir="rtl" style="border-collapse:collapse">
<tr><td colspan="17" align="center"><b>المعدل الشهري والسنوي للمدارس الابتدائية لصفي الخامس والسادس</b></td></tr>
<tr><td colspan="9" align="right">الاسم: <b>${esc(s.n)}</b></td><td colspan="4" align="right">الصف: ${c.g}</td><td colspan="4" align="right">الشعبة: ${esc(c.s)}</td></tr>
<tr><td colspan="9" align="right">الرقم: ${esc(s.adm||s.no)}</td><td colspan="8" align="right">لسنة: ${esc(yr)}</td></tr>
<tr><th bgcolor="#dce8f7">الدروس</th>${HD.map(h=>`<th bgcolor="#dce8f7">${h}</th>`).join('')}</tr>${rows}
<tr><td colspan="6" align="right">نتيجة الامتحان: <b>${r.t}</b>${r.n?' (راسب بـ '+r.n+')':''}</td><td colspan="6" align="right">مرشد الصف:</td><td colspan="5" align="right">المدير:</td></tr></table>`;}
const sel=()=>{const w=$('#who').value,a=S();return {L:w==='all'?a:a.filter(s=>s.id===w),yr:$('#yr').value}};
const rosterHTML=()=>{const c=C(),h=t=>`<th bgcolor="#dce8f7">${t}</th>`;return `<table border="1" cellspacing="0" cellpadding="4" dir="rtl" style="border-collapse:collapse"><tr><td colspan="4" align="center"><b>الفهرست — ${esc(cname(c))}</b></td></tr><tr>${h('ت')}${h('اسم الطالب')}${h('رقم القبول')}${h('ملاحظات')}</tr>${S().map(s=>`<tr><td align="center">${s.no}</td><td align="right">${esc(s.n)}</td><td align="center">${esc(s.adm||'')}</td><td align="right">${esc(s.nt||'')}</td></tr>`).join('')}</table>`};
function pdf(r){const {L,yr}=sel();document.querySelectorAll('#pr').forEach(x=>x.remove());
 const p=document.createElement('div');p.id='pr';p.innerHTML=r?`<div class="pg">${rosterHTML()}</div>`:L.map(s=>`<div class="pg">${sheetHTML(s,yr)}</div>`).join('');
 document.body.appendChild(p);window.onafterprint=()=>p.remove();setTimeout(()=>window.print(),150)}
const xls=(L,yr,r)=>'<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" dir="rtl"><head><meta charset="utf-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>السجل</x:Name><x:WorksheetOptions><x:DisplayRightToLeft/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body>'+(r?rosterHTML():L.map(s=>sheetHTML(s,yr)).join('<br style="mso-special-character:line-break;page-break-before:always">'))+'</body></html>';
async function out(txt,name,type){
 try{const f=new File([txt],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e.name==='AbortError')return}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('تم التنزيل ✅')}catch(e){toast('تعذر التصدير')}}
function xl(r){const {L,yr}=sel();out(xls(L,yr,r),(r?'فهرست-':'سجل-')+cname(C()).replace(/ \/ /g,'-')+'.xls','application/vnd.ms-excel')}
function exp(){const L=S();if(!L.length)return toast('لا يوجد طلاب');
 modal('🖨️ تصدير السجل',`<p class="mu">السنة الدراسية</p><input id="yr" value="${YR()}"><select id="who"><option value="all">كل طلاب الشعبة (صفحة لكل طالب)</option>${L.map(s=>`<option value="${s.id}">${s.no} - ${esc(s.n)}</option>`).join('')}</select>
<button class="b" onclick="pdf()">📄 PDF / طباعة</button><button class="b g" onclick="xl()">📊 Excel</button><hr><button class="b g" onclick="pdf(1)">📄 الفهرست PDF / طباعة</button><button class="b g" onclick="xl(1)">📊 الفهرست Excel</button>
<p class="mu">PDF: من شاشة الطباعة اختر «حفظ كـ PDF» (الورقة أفقية بنفس شكل السجل). إذا ما اشتغلت الطباعة بالتطبيق استخدم Excel أو افتح الرابط بكروم.</p>`);}

/* ---------- الواجهة ---------- */
const TABS=[['st','👥','الطلاب',vSt],['in','✏️','إدخال',vIn],['sh','📋','السجل',vSh],['rs','📊','النتائج',vRs]];
function render(){
 const y=scrollY;
 if(!D.cl.find(c=>c.id===D.cur))D.cur=D.cl.length?D.cl[0].id:null;
 const days=D.lb?Math.floor((Date.now()-D.lb)/864e5):99;
 $('#app').innerHTML=`<header><div class="top"><h1>📘 سجل الدرجات</h1><div class="row" style="margin:0"><button class="ic" onclick="exp()">🖨️</button><button class="ic" onclick="bk()">💾</button><button class="ic" id="cb" onclick="cloudUI()">${cbh()}</button></div></div>
 <div class="row"><select onchange="D.cur=this.value;save();render()">${D.cl.map(c=>`<option value="${c.id}"${c.id===D.cur?' selected':''}>${esc(cname(c))}</option>`).join('')||'<option>لا توجد شعب — اضغط ➕</option>'}</select><button class="ic" onclick="clsForm()">➕</button></div>
 ${D.st.length&&days>=7&&!CL.user?`<div class="warn" onclick="bk()">⚠️ ${D.lb?`مضى ${days} يوم على آخر نسخة احتياطية`:'لم تأخذ نسخة احتياطية بعد'} — اضغط لأخذ نسخة</div>`:''}</header>
 <main>${TABS.find(t=>t[0]===tab)[3]()}</main>
 <nav>${TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="tab='${t[0]}';render();scrollTo(0,0)"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav>`;
 scrollTo(0,y);
}
render();
</script>
<script type="module">
// ⬇️⬇️ الصق هنا إعدادات Firebase حقك (firebaseConfig) بدل القيم التالية ⬇️⬇️
const firebaseConfig = {
  apiKey: "AIzaSyDvp3lS9uaUnD9_uZeXJzIqMcwlYagVNiI",
  authDomain: "grades-record.firebaseapp.com",
  projectId: "grades-record",
  storageBucket: "grades-record.firebasestorage.app",
  messagingSenderId: "582383538992",
  appId: "1:582383538992:web:6990a9f01d24a5f7082ef5"
};
// ⬆️⬆️ لا تغيّر شي تحت هذا السطر ⬆️⬆️

const G='https://www.gstatic.com/firebasejs/10.12.2/';
(async()=>{
 if(!firebaseConfig.apiKey||firebaseConfig.apiKey.startsWith('PASTE')||!firebaseConfig.projectId)return;
 let A,U,F;
 try{[A,U,F]=await Promise.all([import(G+'firebase-app.js'),import(G+'firebase-auth.js'),import(G+'firebase-firestore.js')])}catch(e){window.CFAIL=1;return}
 const app=A.initializeApp(firebaseConfig),auth=U.getAuth(app);
 let db;try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache()})}catch(e){db=F.getFirestore(app)}
 let user=null,ref=null,unsub=null,timer=null,asking=false;
 const has=o=>o&&((o.cl&&o.cl.length)||(o.st&&o.st.length));
 const set=s=>{CL.st=s;paint();const e=document.getElementById('cst');if(e)e.textContent=stTxt()};
 async function write(){
  if(!ref)return;const d=getD();if(!d.lm)d.lm=Date.now();set('sync');
  try{await F.setDoc(ref,{data:JSON.stringify(d),lm:d.lm,at:Date.now()});set('ok')}catch(e){set('err')}
 }
 const push=now=>{if(!ref)return;clearTimeout(timer);set('sync');timer=setTimeout(write,now?0:1500)};
 const watch=()=>{
  const flag='cl_'+user.uid;
  unsub=F.onSnapshot(ref,async snap=>{
   if(snap.metadata.hasPendingWrites)return;
   if(!snap.exists()&&snap.metadata.fromCache)return;
   const loc=getD();let c=null;
   if(snap.exists()){try{c=JSON.parse(snap.data().data)}catch(e){}}
   const linked=localStorage.getItem(flag);
   if(!c){if(has(loc))push(1);else set('ok');localStorage.setItem(flag,'1');return}
   const cl_=c.lm||0,ll=loc.lm||0;
   if(cl_===ll){set('ok');localStorage.setItem(flag,'1');return}
   if(has(c)&&has(loc)&&!linked){
    if(asking)return;asking=true;
    const ch=await new Promise(r=>cloudAsk(c,r));asking=false;
    localStorage.setItem(flag,'1');
    if(ch==='cloud'){applyCloud(c);set('ok')}else push(1);
    return;
   }
   if(cl_>ll||(ll===0&&has(c))){applyCloud(c);set('ok');toast('تمت المزامنة من السحابة ☁️')}
   else if(ll>cl_)push(1);
   localStorage.setItem(flag,'1');
  },()=>set('err'));
 };
 window.cloudPush=()=>push();
 window.cloud={
  login:(e,p)=>U.signInWithEmailAndPassword(auth,e,p),
  signup:(e,p)=>U.createUserWithEmailAndPassword(auth,e,p),
  reset:e=>U.sendPasswordResetEmail(auth,e),
  out:()=>U.signOut(auth),
  sync:()=>push(1)
 };
 U.onAuthStateChanged(auth,u=>{
  user=u;CL.user=u?u.email:null;
  if(unsub){unsub();unsub=null}clearTimeout(timer);ref=null;
  if(u){ref=F.doc(db,'users',u.uid,'data','main');CL.st='sync';watch()}else CL.st='';
  render();
 });
})();
</script>
