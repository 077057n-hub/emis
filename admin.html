<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة المدرسة</title>
<style>
:root{--g:#1f4d43;--bg:#f3f1ea;--bd:#d6d3c6}
*{box-sizing:border-box}
select,input,textarea{min-width:0}
.t button{flex:1 1 auto;min-width:84px;white-space:nowrap}
html,body{overflow-x:hidden}
.fr{border-bottom:1px solid #eee;padding:6px 0}.fr span{display:block;font-weight:700;margin-bottom:2px;font-size:14px}.fr select,.fr input{width:100%;margin:2px 0}
.c{overflow:hidden}
select{max-width:100%;text-overflow:ellipsis}
body{margin:0 auto;background:var(--bg);font-family:Tahoma,Arial,sans-serif;padding:14px;max-width:760px;color:#1b1b1b}
h1{font-size:20px;color:var(--g)}
a{color:var(--g)}
.c{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
input,select,button,textarea{font:inherit;padding:9px 10px;border-radius:8px;border:1px solid #bbb;width:100%;margin:4px 0}
button{background:var(--g);color:#fff;border:0;font-weight:700;cursor:pointer}
button.l{background:#fff;color:var(--g);border:1px solid var(--g)}
.r{display:flex;gap:6px;align-items:center;border-bottom:1px solid #eee;padding:6px 0}
.r b{flex:1;font-weight:600}
.r button,.r select{width:auto;padding:6px 10px;margin:0}
.t{display:flex;gap:6px;margin:10px 0}
.t button{flex:1;margin:0;background:#fff;color:var(--g);border:1px solid var(--g)}
.t .on{background:var(--g);color:#fff}
.m{color:#666;font-size:13px}
label.k{display:inline-flex;gap:4px;align-items:center;margin:4px 0 4px 10px}
label.k input{width:auto;margin:0}
table{border-collapse:collapse;font-size:13px;white-space:nowrap}
th,td{border:1px solid #ddd;padding:5px 8px;text-align:center}
th{background:#e4e2d8}
.tw{overflow:auto;background:#fff;border:1px solid #ddd;border-radius:8px;margin:8px 0}
td.f{color:#d23f37;font-weight:700}
</style>
</head>
<body>
<h1>🏫 إدارة المدرسة</h1>
<div id="app"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,addDoc,writeBatch,query,orderBy,limit} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const app=initializeApp({apiKey:"AIzaSyBkyhe6WrXrBz_jraFt1O0aIW5UoI-oE_g",authDomain:"grades-record-1a3bd.firebaseapp.com",projectId:"grades-record-1a3bd",storageBucket:"grades-record-1a3bd.firebasestorage.app",messagingSenderId:"250496527897",appId:"1:250496527897:web:98d1eedf8b62695f1f0488"});
const auth=getAuth(app),db=getFirestore(app);
const URL_='https://efbkhyzaijlkmvmphmzq.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmYmtoeXphaWpsa212bXBobXpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMTc2OTYsImV4cCI6MjEwNjg5MzY5Nn0.vQqMvAJzjBziwwomQrKolcEGVbOydq6ZRAUt_0wt0h4';
const GR=['الأول','الثاني','الثالث','الرابع','الخامس','السادس'],SEC=['أ','ب'];
const $=s=>document.querySelector(s);
const clean=s=>String(s||'').replace(/[\s\u200B-\u200F\u202A-\u202E\u2066-\u2069\uFEFF]/g,'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).toLowerCase();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
const by=(a,b)=>norm(a.n).localeCompare(norm(b.n),'ar');
const msg=t=>{const e=$('#ms');if(e)e.textContent=t};
const ok=async f=>{try{await f()}catch(e){msg('تعذر: '+(e.code||e.message))}};
const SUBS=['التربية الإسلامية','اللغة العربية','اللغة الإنكليزية','الرياضيات','الاجتماعيات','العلوم','الحاسوب','اللغة الفرنسية','التربية الفنية والنشيد','التربية الرياضية'];
let TNM={},CLX=[],CF=null;
let tab=location.hash==='#gr'?'gr':'imp',user=null,roster=null,prev=null,TC={},TS={},TG={};
const loadR=async force=>{if(!roster||force)roster=(await getDocs(collection(db,'roster'))).docs.map(d=>({eid:d.id,...d.data()}));return roster};

let role=null;
const TA=[['imp','استيراد'],['cl','تعيين الشعب'],['tc','المعلمون'],['st','الطلاب'],['lg','النقل'],['gr','الدرجات'],['vw','المعاونون']],TV=[['gr','الدرجات']];
function render(){
 const A=$('#app');
 if(!user){A.innerHTML='<div class="c"><input id="em" type="email" dir="ltr" placeholder="الإيميل"><input id="pw" type="password" dir="ltr" placeholder="كلمة المرور"><button onclick="lg()">دخول</button><button class="l" onclick="su()">إنشاء حساب جديد</button></div><p class="m" id="ms"></p>';return}
 if(role===null){A.innerHTML=`<p class="m">${esc(user.email)} — جاري التحقق من الصلاحية…</p>`;return}
 if(role==='none'){A.innerHTML=`<p class="m">${esc(user.email)} — <a href="#" onclick="out();return false">خروج</a></p><div class="c"><p style="color:#b3261e">⚠️ هذا الحساب غير مخوّل. سجّل دخول بإيميل المالك أو المعاون.</p></div>`;return}
 const T=role==='admin'?TA:TV;
 if(!T.some(x=>x[0]===tab))tab=T[0][0];
 A.innerHTML=`<p class="m">${esc(user.email)} (${role==='admin'?'المالك':'معاون'}) — <a href="#" onclick="out();return false">خروج</a></p><div class="t" style="flex-wrap:wrap">${T.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</div><div id="v"></div><p class="m" id="ms"></p>`;
 ({imp:vImp,cl:vCl,tc:vTc,st:vSt,lg:vLg,gr:vGr,vw:vVw})[tab]();
}
Object.assign(window,{
 go:k=>{tab=k;CF=null;render()},
 out:()=>signOut(auth),
 lg:()=>ok(()=>signInWithEmailAndPassword(auth,clean($('#em').value),$('#pw').value)),
 su:()=>ok(()=>createUserWithEmailAndPassword(auth,clean($('#em').value),$('#pw').value))
});
onAuthStateChanged(auth,u=>{
 user=u;role=null;CLSL=null;SC=null;render();
 if(!u)return;
 (async()=>{
  try{await getDocs(query(collection(db,'teachers'),limit(1)));role='admin'}
  catch(e){
   try{const v=await getDoc(doc(db,'viewers',(u.email||'').toLowerCase()));role=v.exists()?'viewer':'none'}catch(x){role='none'}
  }
  render();
 })();
});



/* ---- تعيين الشعب والكادر ---- */
const syncNames=async(em,nm)=>{
 if(!nm)return;
 const cs=await getDocs(collection(db,'classes'));
 for(const d of cs.docs){const c=d.data(),u={};
  if(c.guide===em)u.guideName=nm;
  const tn={...(c.tn||{})};let ch=false;
  Object.entries(c.subjects||{}).forEach(([sb,x])=>{if(x===em&&tn[sb]!==nm){tn[sb]=nm;ch=true}});
  if(ch)u.tn=tn;
  if(Object.keys(u).length)await updateDoc(doc(db,'classes',d.id),u);
 }
 CLX=[];
};
const tLabel=e=>TNM[e]||e;
async function vCl(){
 const [cs,ts]=await Promise.all([getDocs(collection(db,'classes')),getDocs(collection(db,'teachers'))]);
 TNM={};ts.docs.forEach(d=>TNM[d.id]=d.data().name||'');
 CLX=cs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>GR.indexOf(a.g)-GR.indexOf(b.g)||String(a.s).localeCompare(b.s,'ar'));
 if(CF)return vClForm();
 $('#v').innerHTML=`<div class="c"><b>➕ إضافة شعبة</b><div class="r"><select id="ng">${GR.map(g=>`<option>${g}</option>`).join('')}</select><select id="ns">${SEC.map(s=>`<option>${s}</option>`).join('')}</select><button onclick="addCl()">إضافة</button></div></div>`
  +(CLX.length?CLX.map(c=>`<div class="c"><div class="r"><b>${esc(c.g)} / ${esc(c.s)}<br><span class="m">مرشد الصف: ${esc(c.guideName||(c.guide?c.guide:'—'))}<br>${Object.keys(c.subjects||{}).length} مادة معيّنة</span></b><button class="l" onclick="editCl('${c.id}')">👥 تعيين</button><button class="l" onclick="delCl('${c.id}')">🗑</button></div></div>`).join(''):'<p class="m">لا توجد شعب. أضف شعبة من الأعلى.</p>');
}
window.backCl=()=>{CF=null;vCl()};
window.addCl=()=>ok(async()=>{
 const g=$('#ng').value,s=$('#ns').value,id=g+'_'+s;
 if(CLX.some(c=>c.id===id))return msg('الشعبة موجودة مسبقاً');
 await setDoc(doc(db,'classes',id),{g,s,guide:'',guideName:'',subjects:{},tn:{},members:[],u:Date.now()});
 vCl();
});
window.delCl=id=>{if(confirm('حذف الشعبة؟ (الطلاب والدرجات المخزنة لا تُحذف من الجدول المشترك)'))ok(async()=>{await deleteDoc(doc(db,'classes',id));vCl()})};
window.editCl=id=>{CF=CLX.find(c=>c.id===id);vClForm()};
function vClForm(){
 const c=CF,opts=sel=>'<option value="">— بدون —</option>'+Object.keys(TNM).sort().map(e=>`<option value="${esc(e)}"${e===sel?' selected':''}>${esc(tLabel(e))}</option>`).join('');
 $('#v').innerHTML=`<button class="l" onclick="backCl()">⬅️ رجوع</button><h3 style="margin:8px 0">${esc(c.g)} / ${esc(c.s)}</h3>`
  +(Object.keys(TNM).length?'':'<p class="m" style="color:#b3261e">لا يوجد معلمون مسجلون. أضفهم أولاً من تبويب «المعلمون».</p>')
  +`<div class="c"><b>مرشد الصف</b><select id="cg">${opts(c.guide)}</select></div><div class="c"><b>معلم كل مادة</b>`
  +SUBS.map((sb,i)=>`<div class="fr"><span>${sb}</span><select class="cs" data-sb="${sb}">${opts((c.subjects||{})[sb])}</select></div>`).join('')
  +`</div><button onclick="saveCl()">💾 حفظ التعيينات</button>`;
}
window.saveCl=()=>ok(async()=>{
 const c=CF,guide=$('#cg').value,subjects={},tn={};
 document.querySelectorAll('.cs').forEach(x=>{if(x.value){subjects[x.dataset.sb]=x.value;tn[x.dataset.sb]=TNM[x.value]||''}});
 const members=[...new Set([guide,...Object.values(subjects)].filter(Boolean))];
 await updateDoc(doc(db,'classes',c.id),{guide,guideName:guide?(TNM[guide]||''):'',subjects,tn,members,u:Date.now()});
 if(guide)await setDoc(doc(db,'teachers',guide),{guide:true},{merge:true});
 CF=null;msg('تم الحفظ ✅');vCl();
});

/* ---- استيراد من الإيمس ---- */
function vImp(){
 $('#v').innerHTML='<div class="c"><p>كلمة سر لوحة الإيمس:</p><input id="ip" type="password" dir="ltr"><button onclick="fetchE()">جلب من الإيمس ومعاينة</button><div id="pv"></div></div>';
}
window.fetchE=()=>ok(async()=>{
 msg('جاري الجلب…');
 const r=await fetch(URL_+'/rest/v1/rpc/admin_list',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({pw:$('#ip').value})});
 if(!r.ok)return msg('كلمة السر غير صحيحة');
 const rows=await r.json(),ex=await loadR(true);
 const ids=new Set(ex.map(x=>x.eid)),names=new Set(ex.filter(x=>!x.del).map(x=>norm(x.n)));
 const add=[];let dup=0,old=0,skip=0,nosec=0;
 rows.forEach(x=>{
  const g=String(x.grade||'').replace(' الابتدائي','');
  if(!GR.includes(g)){skip++;return}
  const eid='e'+x.id;
  if(ids.has(eid)){old++;return}
  const n=[x.full_name,x.father_name,x.grandfather_name].filter(Boolean).join(' ').trim();
  if(!n||names.has(norm(n))){dup++;return}
  const s0=norm(x.section).toLowerCase();
  const s=s0==='ا'||s0==='a'?'أ':s0==='ب'||s0==='b'?'ب':'—';
  if(s==='—')nosec++;
  names.add(norm(n));add.push({eid,n,g,s});
 });
 prev=add;
 const cnt={};add.forEach(x=>{const k=x.g+' / '+x.s;cnt[k]=(cnt[k]||0)+1});
 $('#pv').innerHTML=`<p>جديد: <b>${add.length}</b> — مكرر بالاسم: ${dup} — مستورد سابقاً: ${old} — خارج الابتدائي: ${skip}${nosec?` — بدون شعبة: ${nosec}`:''}</p>`+Object.entries(cnt).map(([k,v])=>`<div class="r"><b>${esc(k)}</b>${v}</div>`).join('')+(add.length?`<button onclick="saveE()">حفظ ${add.length} طالب</button>`:'');
 msg('');
});
window.saveE=()=>ok(async()=>{
 for(let i=0;i<prev.length;i+=400){
  const b=writeBatch(db);
  prev.slice(i,i+400).forEach(x=>b.set(doc(db,'roster',x.eid),{n:x.n,g:x.g,s:x.s,u:Date.now()}));
  await b.commit();
 }
 msg('تم حفظ '+prev.length+' طالب ✅');prev=null;roster=null;$('#pv').innerHTML='';
});

/* ---- المعلمون ---- */
async function vTc(){
 const s=await getDocs(collection(db,'teachers'));TC={};
 s.docs.forEach(d=>{TC[d.id]=d.data().grades||[];TNM[d.id]=d.data().name||'';TS[d.id]=d.data().subjects||[];TG[d.id]=!!d.data().guide});
 $('#v').innerHTML='<div class="c"><input id="te" type="email" dir="ltr" placeholder="إيميل المعلم"><input id="tnm" placeholder="اسم المعلم (يظهر بدل الإيميل)">'+GR.map(g=>`<label class="k gk"><input type="checkbox" value="${g}">${g}</label>`).join('')+'<p class="m">المواد (اتركها فارغة = كل المواد):</p>'+SUBS.map(x=>`<label class="k sk"><input type="checkbox" value="${x}">${x}</label>`).join('')+'<label class="k"><input type="checkbox" id="tg"> مرشد صف (يظهر له سجل الدرجات)</label><button onclick="saveT()">حفظ</button></div>'
  +Object.entries(TC).map(([e,g])=>`<div class="r"><b style="text-align:right">${esc(TNM[e]||'بدون اسم')}<br><span class="m" dir="ltr">${esc(e)}</span><br><span class="m">${esc(g.join('، '))}${(TS[e]||[]).length?' — '+esc(TS[e].join('، ')):''}${TG[e]?' — مرشد صف':''}</span></b><button class="l" onclick="editT('${esc(e)}')">✏️</button><button class="l" onclick="delT('${esc(e)}')">🗑</button></div>`).join('');
}
window.saveT=()=>ok(async()=>{
 const e=clean($('#te').value),g=[...document.querySelectorAll('.gk input:checked')].map(x=>x.value),sb=[...document.querySelectorAll('.sk input:checked')].map(x=>x.value);
 if(!e||!g.length)return msg('اكتب الإيميل واختر صفاً واحداً على الأقل');
 const nm=$('#tnm').value.trim();
 await setDoc(doc(db,'teachers',e),{grades:g,subjects:sb,guide:$('#tg').checked,name:nm});
 await syncNames(e,nm);vTc();
});
window.editT=e=>{$('#te').value=e;$('#tnm').value=TNM[e]||'';document.querySelectorAll('.gk input').forEach(x=>x.checked=TC[e].includes(x.value));document.querySelectorAll('.sk input').forEach(x=>x.checked=(TS[e]||[]).includes(x.value));$('#tg').checked=!!TG[e]};
window.delT=e=>{if(confirm('حذف المعلم؟'))ok(async()=>{await deleteDoc(doc(db,'teachers',e));vTc()})};

/* ---- الطلاب ---- */
async function vSt(){
 await loadR();
 $('#v').innerHTML=`<div class="r"><select id="fg" onchange="drawS()">${GR.map(g=>`<option>${g}</option>`).join('')}</select><select id="fs" onchange="drawS()">${[...SEC,'—'].map(s=>`<option>${s}</option>`).join('')}</select></div><div class="c"><p class="m">الصق أسماء الطلاب، كل اسم بسطر. تنضاف للصف والشعبة المختارين بالأعلى، وتترتب أبجدياً وتنرقّم تلقائياً، والمكرر يتجاهل.</p><textarea id="an" rows="6" placeholder="مثال:&#10;أحمد علي حسن&#10;باقر جميل نعيم"></textarea><button class="l" onclick="addS()">➕ إضافة الأسماء</button></div><div id="sl"></div>`;
 drawS();
}
window.drawS=()=>{
 const g=$('#fg').value,s=$('#fs').value,L=roster.filter(x=>!x.del&&x.g===g&&x.s===s).sort(by);
 $('#sl').innerHTML=`<p class="m">${L.length} طالب</p>`+L.map((x,i)=>`<div class="r"><span class="m">${i+1}</span><b>${esc(x.n)}</b>${SEC.filter(y=>y!==x.s).map(y=>`<button class="l" onclick="mvS('${x.eid}','${y}')">→ ${y}</button>`).join('')}<button class="l" onclick="rmS('${x.eid}')">🗑</button></div>`).join('');
};
window.addS=()=>ok(async()=>{
 const g=$('#fg').value,s=$('#fs').value;
 const names=$('#an').value.split('\n').map(x=>x.replace(/^[\s\d٠-٩\.\-\)\(،:]+/,'').replace(/\s+/g,' ').trim()).filter(Boolean);
 if(!names.length)return msg('الصق الأسماء أولاً');
 const seen=new Set(roster.filter(x=>!x.del).map(x=>norm(x.n)));
 const add=[];let dup=0;
 names.forEach(n=>{const k=norm(n);if(seen.has(k)){dup++;return}seen.add(k);add.push(n)});
 const t=Date.now();
 for(let i=0;i<add.length;i+=400){
  const b=writeBatch(db);
  add.slice(i,i+400).forEach((n,j)=>{const id='m'+t.toString(36)+(i+j).toString(36),x={n,g,s,u:t};b.set(doc(db,'roster',id),x);roster.push({eid:id,...x})});
  await b.commit();
 }
 $('#an').value='';drawS();
 msg(`أضيف ${add.length} طالب إلى ${g} / ${s}${dup?` — ${dup} مكرر تم تجاهله`:''} ✅`);
});
window.mvS=(eid,to)=>ok(async()=>{
 const x=roster.find(r=>r.eid===eid),from=x.s;
 await updateDoc(doc(db,'roster',eid),{s:to,u:Date.now()});
 await addDoc(collection(db,'moves'),{eid,n:x.n,g:x.g,from,to,by:user.email,at:Date.now()});
 x.s=to;drawS();
});
window.rmS=eid=>{if(confirm('حذف الطالب من الجدول المشترك؟'))ok(async()=>{await updateDoc(doc(db,'roster',eid),{del:true,u:Date.now()});roster.find(r=>r.eid===eid).del=true;drawS()})};

/* ---- سجل النقل ---- */
async function vLg(){
 const s=await getDocs(query(collection(db,'moves'),orderBy('at','desc'),limit(40)));
 $('#v').innerHTML=s.docs.length?s.docs.map(d=>{const m=d.data();return `<div class="r"><b>${esc(m.n)}<br><span class="m">${esc(m.g)}: ${esc(m.from)} ← ${esc(m.to)} — ${esc(m.by)} — ${new Date(m.at).toLocaleString('ar-IQ')}</span></b>${m.undone?'<span class="m">تم التراجع</span>':`<button class="l" onclick="undo('${d.id}','${m.eid}','${esc(m.from)}')">↩️ تراجع</button>`}</div>`}).join(''):'<p class="m">لا توجد عمليات نقل</p>';
}
window.undo=(id,eid,from)=>ok(async()=>{
 await updateDoc(doc(db,'roster',eid),{s:from,u:Date.now()});
 await updateDoc(doc(db,'moves',id),{undone:true});roster=null;vLg();
});

/* ---- المعاونون (يشاهدون الدرجات فقط) ---- */
async function vVw(){
 const s=await getDocs(collection(db,'viewers'));
 $('#v').innerHTML='<div class="c"><p class="m">المعاون يشوف كل الشعب وسجلات كل الطلاب ويعدّل الدرجات. لازم يسوي حساباً بإيميله من زر «إنشاء حساب جديد» بهذي الصفحة.</p><input id="ve" type="email" dir="ltr" placeholder="إيميل المعاون"><button onclick="saveV()">إضافة</button></div>'
  +s.docs.map(d=>`<div class="r"><b dir="ltr" style="text-align:right">${esc(d.id)}</b><button class="l" onclick="delV('${esc(d.id)}')">🗑</button></div>`).join('');
}
window.saveV=()=>ok(async()=>{const e=clean($('#ve').value);if(!e)return msg('اكتب الإيميل');await setDoc(doc(db,'viewers',e),{at:Date.now()});vVw()});
window.delV=e=>{if(confirm('حذف المعاون؟'))ok(async()=>{await deleteDoc(doc(db,'viewers',e));vVw()})};

/* ---- سجلات الدرجات لكل الشعب (النظام الجديد) ---- */
const CO=['تشرين 1','تشرين 2','كانون 1','كانون 2','نصف السنة','شباط','آذار','نيسان','أيار','النهائي','الدور الثاني'];
let CLSL=null,SC=null,GM=0,GRD={};
const nm=x=>x===undefined||x===null||x===''||isNaN(+x)?null:+x;
const mean=a=>{a=a.filter(x=>x!==null);return a.length?Math.round(a.reduce((p,q)=>p+q,0)/a.length):null};
const EG=g=>['الأول','الثاني','الثالث','الرابع'].includes(g);
const rosOf=c=>roster.filter(r=>!r.del&&r.g===c.g&&r.s===c.s).sort(by);
function calc(sid,sb){
 const g=Array.from({length:11},(_,i)=>nm((GRD[sid+'|'+sb]||{})[i]));
 if(EG(SC.g))return {g,eff:mean(g.slice(0,10))};
 const a1=mean(g.slice(0,4)),a2=mean(g.slice(5,9)),annual=mean([a1,g[4],a2]),fin=annual!==null&&g[9]!==null?Math.round((annual+g[9])/2):null;
 return {g,a1,a2,annual,eff:g[10]!==null?g[10]:fin};
}
async function vGr(){
 if(!CLSL){await loadR();CLSL=(await getDocs(collection(db,'classes'))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>GR.indexOf(a.g)-GR.indexOf(b.g)||String(a.s).localeCompare(b.s,'ar'))}
 if(SC)return vSec();
 $('#v').innerHTML=`<p class="m">${CLSL.length} شعبة معيّنة</p>`
  +(CLSL.length?CLSL.map(c=>`<div class="r" onclick="openSec('${c.id}')" style="cursor:pointer"><b>${esc(c.g)} / ${esc(c.s)}<br><span class="m">${rosOf(c).length} طالب — ${Object.keys(c.subjects||{}).length} مادة — مرشد: ${esc(c.guide||'—')}</span></b><button class="l">فتح</button></div>`).join(''):'<p class="m">لا توجد شعب معيّنة. عيّنها من تبويب «تعيين الشعب».</p>')
  +'<button class="l" onclick="reloadSec()">🔄 تحديث</button>';
}
window.reloadSec=()=>{CLSL=null;SC=null;vGr()};
window.backSec=()=>{SC=null;vGr()};
window.setGM=i=>{GM=i;vSec()};
window.openSec=id=>ok(async()=>{
 SC=CLSL.find(c=>c.id===id);GM=0;GRD={};
 (await getDocs(collection(db,'classes',id,'grades'))).forEach(d=>{const o=d.data();GRD[o.sid+'|'+o.sub]=o.v||{}});
 vSec();
});
function vSec(){
 const c=SC,L=rosOf(c),subs=Object.keys(c.subjects||{}),early=EG(c.g),pass=early?5:50,mon=early?CO.slice(0,10):CO;
 if(GM>=mon.length)GM=0;
 let tot=0,fil=0;
 const rows=L.map((s,i)=>`<tr><td style="text-align:right"><a href="#" onclick="stuRec('${s.eid}');return false">${i+1}. ${esc(s.n)}</a></td>`+subs.map(sb=>{const x=nm((GRD[s.eid+'|'+sb]||{})[GM]);tot++;if(x!==null)fil++;return `<td${x!==null&&x<pass?' class="f"':''}>${x===null?'–':x}</td>`}).join('')+'</tr>').join('');
 const avg=subs.map(sb=>{const a=L.map(s=>nm((GRD[s.eid+'|'+sb]||{})[GM])).filter(x=>x!==null);return `<td><b>${a.length?(a.reduce((p,q)=>p+q,0)/a.length).toFixed(1):'–'}</b></td>`}).join('');
 $('#v').innerHTML=`<button class="l" onclick="backSec()">⬅️ كل الشعب</button><h3 style="margin:8px 0">${esc(c.g)} / ${esc(c.s)}</h3><p class="m">مرشد الصف: ${esc(c.guide||'—')}</p>`
  +`<div style="display:flex;gap:6px;overflow:auto">${mon.map((x,i)=>`<button class="l" style="width:auto;${i===GM?'background:#1f4d43;color:#fff':''}" onclick="setGM(${i})">${x}</button>`).join('')}</div>`
  +`<p class="m">اكتمال الدرجات: ${fil} من ${tot} خانة — الأحمر أقل من ${pass} — اضغط اسم الطالب لسجله</p>`
  +`<div class="tw"><table><tr><th>الطالب</th>${subs.map(x=>`<th>${esc(x)}<br><span class="m">${esc((c.subjects[x]||'—').split('@')[0])}</span></th>`).join('')}</tr>${rows}<tr><td>معدل الشعبة</td>${avg}</tr></table></div>`;
}
window.vSec=vSec;
window.stuRec=eid=>{
 const c=SC,s=roster.find(x=>x.eid===eid),subs=Object.keys(c.subjects||{}),early=EG(c.g),pass=early?5:50;
 const R=subs.map(sb=>({sb,k:calc(eid,sb)}));
 let n=0,any=false;R.forEach(r=>{if(r.k.eff!==null){any=true;if(r.k.eff<pass)n++}});
 const res=!any?'—':n===0?'ناجح':n<=3?'إكمال':'راسب';
 $('#v').innerHTML=`<button class="l" onclick="vSec()">⬅️ رجوع للشعبة</button><h3 style="margin:8px 0">${esc(s.n)}</h3><p class="m">${esc(c.g)} / ${esc(c.s)} — النتيجة: <b>${res}</b>${n?' (راسب بـ '+n+' مواد)':''}</p>`
  +`<div class="tw"><table><tr><th>المادة</th>${CO.slice(0,early?10:11).map(x=>`<th>${x}</th>`).join('')}${early?'<th>المعدل</th>':'<th>ن1</th><th>ن2</th><th>السنوي</th><th>النهائية</th>'}</tr>`
  +R.map(({sb,k})=>`<tr><td style="text-align:right">${esc(sb)}</td>${k.g.slice(0,early?10:11).map(x=>`<td>${x===null?'':x}</td>`).join('')}${early?'':`<td>${k.a1??''}</td><td>${k.a2??''}</td><td>${k.annual??''}</td>`}<td${k.eff!==null&&k.eff<pass?' class="f"':''}><b>${k.eff??''}</b></td></tr>`).join('')+'</table></div>';
};
</script>
</body>
</html>
