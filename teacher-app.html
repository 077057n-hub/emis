<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر المعلم</title>
<style>
:root{--bg:#eef4f3;--card:#fff;--tx:#1d2e2b;--mu:#68807b;--pr:#2f8f83;--pl:#d9eeea;--bd:#dce8e5;--no:#d65f58}
@media(prefers-color-scheme:dark){:root{--bg:#111a18;--card:#1a2724;--tx:#e5eeec;--mu:#8ea49f;--pr:#5cc4b5;--pl:#22403b;--bd:#2a3b37}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 8px}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:21px}
main{padding:4px 14px}
.row{display:flex;gap:8px;margin:8px 0}
select,input,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0}
.b{display:block;width:100%;padding:12px;border:0;border-radius:12px;background:var(--pr);color:#fff;font:inherit;font-weight:700;margin:6px 0;text-align:center}
.row .b{margin:0}
.b.g{background:var(--pl);color:var(--pr)}
.ic{border:0;background:var(--card);border-radius:12px;min-width:44px;height:44px;font-size:20px;box-shadow:0 1px 3px #0002}
.ic.s{box-shadow:none;background:none;min-width:36px}
.card{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:11px 12px;margin:8px 0}
.card b{flex:1;font-weight:600}
.n{background:var(--pl);color:var(--pr);border-radius:8px;min-width:28px;text-align:center;padding:2px 0;font-size:13px}
.mu{color:var(--mu);font-size:13px}
.seg{display:flex;gap:6px}
.seg button{width:40px;height:40px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);font-size:18px;opacity:.5}
.seg .on{opacity:1;border-color:var(--pr);background:var(--pl)}
.chips{display:flex;gap:8px;margin:8px 0}
.chips span{flex:1;text-align:center;background:var(--card);border-radius:12px;padding:8px}
.tw{overflow-x:auto;background:var(--card);border-radius:14px;margin-top:8px}
table{border-collapse:collapse;width:100%;min-width:470px}
th,td{padding:6px 3px;text-align:center;border-bottom:1px solid var(--bd);font-size:13px}
td:first-child{text-align:right;min-width:88px;padding-right:10px}
td input{padding:8px 2px;text-align:center;width:54px;margin:0}
.pill{border-radius:20px;padding:3px 10px;font-size:13px;background:var(--pl);color:var(--pr);font-weight:700}
.pill.neg{background:#f8dcda;color:#a73832}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:8px 0;color:var(--mu);font:inherit;font-size:11px}
nav button span{display:block;font-size:22px}
nav .on{color:var(--pr);font-weight:700}
.ov{position:fixed;inset:0;background:#0007;z-index:9;display:flex;align-items:flex-end}
.sh{background:var(--card);width:100%;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sh h3{margin-bottom:6px}
.warn{background:#fdf0cf;color:#6f5000;border-radius:12px;padding:10px;font-size:13px;margin-top:8px}
.empty{text-align:center;color:var(--mu);padding:44px 0}
.empty div{font-size:48px}
.t{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:20;font-size:14px}
.days{display:flex;gap:6px;overflow-x:auto;margin:8px 0}
.days button{flex:1;min-width:64px;padding:10px 4px;border:0;border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-size:13px}
.days .on{background:var(--pr);color:#fff;font-weight:700}
hr{border:0;border-top:1px solid var(--bd);margin:12px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const E0=()=>({cl:[],st:[],at:{},gr:{},bh:[],sc:[],cur:null,lb:0});
let D=E0(),tab='st',AD,SD;
try{Object.assign(D,JSON.parse(localStorage.getItem('dm')||'{}'))}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const save=()=>{try{localStorage.setItem('dm',JSON.stringify(D))}catch(e){toast('تعذر الحفظ!')}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
AD=today();SD=new Date().getDay()<5?new Date().getDay():0;
const S=()=>D.st.filter(s=>s.c===D.cur);
const cn=id=>{const c=D.cl.find(x=>x.id===id);return c?c.n:'—'};
const empty=(i,t)=>`<div class="empty"><div>${i}</div><p>${t}</p></div>`;
function toast(t){const e=document.createElement('div');e.className='t';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function modal(t,body,ok,txt){
 const m=document.createElement('div');m.className='ov';
 m.innerHTML=`<div class="sh"><h3>${t}</h3><div>${body}</div><div class="row">${ok?`<button class="b" id="mo">${txt||'حفظ'}</button>`:''}<button class="b g" id="mc">${ok?'إلغاء':'إغلاق'}</button></div></div>`;
 document.body.appendChild(m);
 m.querySelector('#mc').onclick=()=>m.remove();
 if(ok)m.querySelector('#mo').onclick=()=>{if(ok(m)!==false)m.remove()};
 m.onclick=e=>{if(e.target===m)m.remove()};
 return m;
}
const ask=(t,fn)=>modal('تأكيد',`<p>${t}</p>`,()=>{fn()},'نعم');
const v=(m,s)=>m.querySelector(s).value.trim();

/* ---------- الطلاب ---------- */
const cnt=(id,k)=>Object.keys(D.at).filter(x=>x.endsWith('|'+id)&&D.at[x]===k).length;
const bsum=id=>D.bh.filter(b=>b.s===id).reduce((a,b)=>a+b.p,0);
function vSt(){const L=S();
 return `<div class="row"><button class="b" onclick="addS()">➕ إضافة طلاب</button>${D.cur?`<button class="b g" onclick="delC()">🗑 حذف الشعبة</button>`:''}</div>`
 +(L.length?L.map((s,i)=>`<div class="card"><span class="n">${i+1}</span><b>${esc(s.n)}</b><span class="mu">❌${cnt(s.id,'a')} ⭐${bsum(s.id)}</span><button class="ic s" onclick="delS('${s.id}')">🗑</button></div>`).join(''):empty('👥','أضف طلاب هذي الشعبة'));}
function addS(){if(!D.cur)return toast('أضف شعبة أولاً ➕');
 modal('➕ إضافة طلاب',`<p class="mu">اكتب اسم كل طالب بسطر مستقل</p><textarea id="ns" rows="8"></textarea>`,m=>{
  v(m,'#ns').split('\n').map(x=>x.trim()).filter(Boolean).forEach(n=>D.st.push({id:uid(),c:D.cur,n}));save();render()});}
const delS=id=>ask('حذف الطالب وكل بياناته؟',()=>{D.st=D.st.filter(s=>s.id!==id);D.bh=D.bh.filter(b=>b.s!==id);delete D.gr[id];Object.keys(D.at).forEach(k=>k.endsWith('|'+id)&&delete D.at[k]);save();render()});
function addC(){modal('➕ شعبة جديدة',`<input id="g" placeholder="الصف (مثال: الخامس)"><input id="s" placeholder="الشعبة (مثال: أ)">`,m=>{
 if(!v(m,'#g'))return false;const c={id:uid(),n:v(m,'#g')+' / '+(v(m,'#s')||'—')};D.cl.push(c);D.cur=c.id;save();render()});}
const delC=()=>ask('حذف الشعبة مع كل طلابها وبياناتهم؟',()=>{S().forEach(s=>{D.bh=D.bh.filter(b=>b.s!==s.id);delete D.gr[s.id];Object.keys(D.at).forEach(k=>k.endsWith('|'+s.id)&&delete D.at[k])});D.st=D.st.filter(s=>s.c!==D.cur);D.sc=D.sc.filter(x=>x.c!==D.cur);D.cl=D.cl.filter(c=>c.id!==D.cur);D.cur=null;save();render()});

/* ---------- الحضور ---------- */
function vAt(){const L=S(),k=s=>D.at[AD+'|'+s.id],c=x=>L.filter(s=>k(s)===x).length;
 return `<input type="date" value="${AD}" onchange="AD=this.value||today();render()">`
 +`<div class="chips"><span>✅ ${c('p')}</span><span>❌ ${c('a')}</span><span>⏰ ${c('l')}</span></div>`
 +(L.length?`<button class="b g" onclick="allP()">✅ الكل حاضر</button>`:'')
 +(L.length?L.map(s=>`<div class="card"><b>${esc(s.n)}</b><div class="seg">${[['p','✅'],['a','❌'],['l','⏰']].map(([x,e])=>`<button class="${k(s)===x?'on':''}" onclick="mk('${s.id}','${x}')">${e}</button>`).join('')}</div></div>`).join(''):empty('✅','لا يوجد طلاب'));}
const mk=(id,x)=>{const key=AD+'|'+id;D.at[key]===x?delete D.at[key]:D.at[key]=x;save();render()};
const allP=()=>{S().forEach(s=>D.at[AD+'|'+s.id]='p');save();render()};

/* ---------- الدرجات ---------- */
const GN=['شهري 1','شهري 2','نصف السنة','النهائي'];
function avg(id){const g=D.gr[id]||{},a=GN.map((_,i)=>g[i]).filter(x=>x!==undefined&&x!=='');return a.length?Math.round(a.reduce((p,q)=>p+ +q,0)/a.length*10)/10:'–'}
function vGr(){return `<p class="mu">الدرجة من 100 — المعدل يُحسب تلقائياً</p><div class="tw"><table><tr><th>الطالب</th>${GN.map(g=>`<th>${g}</th>`).join('')}<th>المعدل</th></tr>`
 +S().map(s=>`<tr><td>${esc(s.n)}</td>${GN.map((_,i)=>`<td><input type="number" inputmode="decimal" min="0" max="100" value="${(D.gr[s.id]||{})[i]??''}" oninput="sg('${s.id}',${i},this.value)"></td>`).join('')}<td id="av${s.id}"><b>${avg(s.id)}</b></td></tr>`).join('')+`</table></div>`+(S().length?'':empty('📝','لا يوجد طلاب'));}
function sg(id,i,x){(D.gr[id]=D.gr[id]||{})[i]=x;save();const e=$('#av'+id);if(e)e.innerHTML='<b>'+avg(id)+'</b>'}

/* ---------- السلوك ---------- */
function vBh(){const L=S();
 return L.length?L.map(s=>{const t=bsum(s.id);return `<div class="card"><b onclick="bHist('${s.id}')">${esc(s.n)} ${t<=-5?'⚠️':''}</b><span class="pill ${t<0?'neg':''}">${t}</span><button class="ic s" onclick="bAdd('${s.id}',1)">👍</button><button class="ic s" onclick="bAdd('${s.id}',-1)">👎</button><button class="ic s" onclick="bHist('${s.id}')">📜</button></div>`}).join('')+`<p class="mu">⚠️ تظهر عند وصول النقاط إلى -5 أو أقل. اضغط 📜 لعرض السجل.</p>`:empty('⭐','لا يوجد طلاب');}
const bAdd=(id,g)=>modal(g>0?'👍 سلوك إيجابي':'👎 سلوك سلبي',`<input id="bn" placeholder="ملاحظة (اختياري)"><input id="bp" type="number" value="1" min="1">`,m=>{D.bh.push({id:uid(),s:id,d:today(),p:g*Math.max(1,+v(m,'#bp')||1),t:v(m,'#bn')});save();render()});
function bHist(id){const s=D.st.find(x=>x.id===id),L=D.bh.filter(b=>b.s===id).reverse();
 modal('📜 '+esc(s.n),L.length?L.map(b=>`<div class="card"><span class="pill ${b.p<0?'neg':''}">${b.p>0?'+':''}${b.p}</span><b>${esc(b.t||'—')}<br><span class="mu">${b.d}</span></b><button class="ic s" onclick="D.bh=D.bh.filter(x=>x.id!=='${b.id}');save();document.querySelector('.ov').remove();render();bHist('${id}')">🗑</button></div>`).join(''):'<p class="mu">لا توجد سجلات</p>');}

/* ---------- الجدول ---------- */
const DY=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
function vSc(){const L=D.sc.filter(x=>x.d===SD).sort((a,b)=>a.p-b.p);
 return `<div class="days">${DY.map((d,i)=>`<button class="${i===SD?'on':''}" onclick="SD=${i};render()">${d}</button>`).join('')}</div><button class="b" onclick="addP()">➕ إضافة حصة</button>`
 +(L.length?L.map(x=>`<div class="card"><span class="n">${x.p}</span><b>${esc(cn(x.c))}<br><span class="mu">${esc(x.s||'')}</span></b><button class="ic s" onclick="D.sc=D.sc.filter(y=>y.id!=='${x.id}');save();render()">🗑</button></div>`).join(''):empty('📅','لا توجد حصص بهذا اليوم'));}
function addP(){if(!D.cl.length)return toast('أضف شعبة أولاً ➕');
 modal('➕ حصة جديدة',`<select id="p">${[1,2,3,4,5,6,7,8].map(i=>`<option value="${i}">الحصة ${i}</option>`).join('')}</select><select id="c">${D.cl.map(c=>`<option value="${c.id}">${esc(c.n)}</option>`).join('')}</select><input id="s" placeholder="المادة">`,m=>{D.sc.push({id:uid(),d:SD,p:+v(m,'#p'),c:v(m,'#c'),s:v(m,'#s')});save();render()});}

/* ---------- النسخ الاحتياطي ---------- */
const dump=()=>JSON.stringify({v:1,t:Date.now(),D});
const fname=()=>'teacher-backup-'+today()+'.json';
const done=()=>{D.lb=Date.now();save();render()};
async function shr(){try{const f=new File([dump()],fname(),{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'نسخة دفتر المعلم'});done();toast('تمت المشاركة ✅')}else dl()}catch(e){if(e.name!=='AbortError')dl()}}
function dl(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([dump()],{type:'application/json'}));a.download=fname();document.body.appendChild(a);a.click();a.remove();done();toast('تم التنزيل ✅')}catch(e){toast('استخدم زر نسخ كنص')}}
async function cp(){try{await navigator.clipboard.writeText(dump());done();toast('تم النسخ — الصقه بتيليجرام ✅')}catch(e){toast('تعذر النسخ، جرّب المشاركة')}}
function rt(t){try{const o=JSON.parse(t);if(!o.D)throw 0;ask('سيتم استبدال كل البيانات الحالية. متأكد؟',()=>{D=Object.assign(E0(),o.D);save();document.querySelectorAll('.ov').forEach(x=>x.remove());render();toast('تم الاسترجاع ✅')})}catch(e){toast('الملف غير صالح')}}
const rf=f=>f&&f.text().then(rt);
const bk=()=>modal('💾 النسخ الاحتياطي',`<p class="mu">بياناتك محفوظة على هذا الجهاز. خذ نسخة كل أسبوع وأرسلها لنفسك على تيليجرام حتى ما تضيع لو حذفت التطبيق أو غيرت الهاتف.</p>
<button class="b" onclick="shr()">📤 مشاركة النسخة (تيليجرام / واتساب / درايف)</button>
<button class="b g" onclick="dl()">⬇️ تنزيل كملف</button>
<button class="b g" onclick="cp()">📋 نسخ كنص</button><hr>
<label class="b g">📥 استرجاع من ملف<input type="file" accept=".json,application/json" hidden onchange="rf(this.files[0])"></label>
<textarea id="pt" rows="3" placeholder="أو الصق نص النسخة هنا"></textarea>
<button class="b g" onclick="rt($('#pt').value)">استرجاع من النص</button>`);

/* ---------- الواجهة ---------- */
const TABS=[['st','👥','الطلاب',vSt],['at','✅','الحضور',vAt],['gr','📝','الدرجات',vGr],['bh','⭐','السلوك',vBh],['sc','📅','الجدول',vSc]];
function render(){
 const y=scrollY;
 if(!D.cl.find(c=>c.id===D.cur))D.cur=D.cl.length?D.cl[0].id:null;
 const days=D.lb?Math.floor((Date.now()-D.lb)/864e5):99;
 $('#app').innerHTML=`<header><div class="top"><h1>📒 دفتر المعلم</h1><button class="ic" onclick="bk()">💾</button></div>
 <div class="row"><select onchange="D.cur=this.value;save();render()">${D.cl.map(c=>`<option value="${c.id}"${c.id===D.cur?' selected':''}>${esc(c.n)}</option>`).join('')||'<option>لا توجد شعب — اضغط ➕</option>'}</select><button class="ic" onclick="addC()">➕</button></div>
 ${D.st.length&&days>=7?`<div class="warn" onclick="bk()">⚠️ ${D.lb?`مضى ${days} يوم على آخر نسخة احتياطية`:'لم تأخذ نسخة احتياطية بعد'} — اضغط لأخذ نسخة</div>`:''}</header>
 <main>${TABS.find(t=>t[0]===tab)[3]()}</main>
 <nav>${TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="tab='${t[0]}';render();scrollTo(0,0)"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav>`;
 scrollTo(0,y);
}
render();
</script>
<script type="module" src="teacher-link.js"></script>
</body>
</html>
